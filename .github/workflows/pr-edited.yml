name: PR 編輯後重驗

# ci.yml 不收 `edited`：只改 PR 內文時 CI 不重跑，也不取消正在跑的那一輪。這支只處理 gate 會看的那幾種編輯，
# 對這個 head 最新的那一輪 CI 做 rerun。rerun 沿用觸發時的事件，所以 ci.yml 的標題、內文、base 從 API 讀當下的值。
#   - 改標題：gate 驗標題。
#   - 改 base：gate 驗 base 跟這一輪決定範圍時的一樣，不一樣就紅，要推一個 commit 或關閉再打開 PR 重新觸發。
#   - develop → main 的 PR 改內文：gate 驗內文的段落。
#   - 功能 PR 改內文：只有清外部對照的 PR（只動註解與字串內容、對照詞計數下降，.github/scripts/check_dsh_cleanup.py 判）的 gate 讀內文，
#     所以先用同一支腳本判範圍，在範圍內才重跑；其餘功能 PR 改內文照舊不重跑。
#     例外：check_pr.py 對每張 PR 的內文查個人絕對路徑（check_personal_paths.py），這一項改內文不會重跑，要推一個 commit 才重驗。
#
# job 不能叫 gate：這支的 job 或步驟在不用重跑時會被跳過（例如範圍外的內文編輯只跳過 rerun 那一步），跳過的 required check 算成通過。
on:
  pull_request:
    branches: [develop, main]
    types: [edited]

permissions:
  contents: read

# 不設 concurrency：同一組裡後來的只改內文會取消或頂掉前面改標題的那一輪，標題就沒人驗。
# 兩輪同時處理標題時，晚到的那輪 rerun 會撞上已經在跑的一輪，見最後一步。

jobs:
  rerun:
    name: 重跑 CI
    if: github.event.changes.title || github.event.changes.base || github.event.changes.body
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    env:
      # 只改內文的功能 PR 才要先判範圍；改標題、改 base、改 main 的 PR 的內文一律重跑。
      SCOPE_FIRST: ${{ github.event.changes.body && !github.event.changes.title && !github.event.changes.base && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v7
        if: env.SCOPE_FIRST == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 判斷內文是不是 gate 會讀的
        id: scope
        if: env.SCOPE_FIRST == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          scope=$(python3 .github/scripts/check_dsh_cleanup.py --in-scope --base "$(git merge-base "origin/$BASE_REF" HEAD)")
          echo "in_scope=$scope" >> "$GITHUB_OUTPUT"

      - name: rerun 這個 head 最新的一輪
        if: env.SCOPE_FIRST != 'true' || steps.scope.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs="repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1"
          run_id=$(gh api "$runs" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "這個 head 還沒有 CI 的一輪；建立時會讀當下的標題，不用重跑。"
            exit 0
          fi
          # 還在跑的那一輪可能已經用舊標題驗過，取消後重跑。
          if [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)" != "completed" ]; then
            gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel" > /dev/null
            for _ in $(seq 120); do
              [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)" = "completed" ] && break
              sleep 5
            done
          fi
          if ! gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun" > /dev/null; then
            # 另一輪編輯已經先重跑了它；那一輪同樣讀當下的值。
            [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)" != "completed" ] || exit 1
            echo "run $run_id 已經在重跑"
            exit 0
          fi
          echo "已重跑 run $run_id"
