name: 暫時：rerun 探針
# #2090 第 7 條：驗 GITHUB_TOKEN（actions: write）能不能 rerun 另一個已完成的 run。開 PR 前拿掉。
on:
  push:
    branches: [ci/gate-60s]
permissions:
  contents: read
jobs:
  target:
    name: target
    runs-on: ubuntu-latest
    steps:
      - run: echo "run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
  rerun:
    name: rerun
    needs: target
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          prev=$(gh api "repos/$REPO/actions/workflows/rerun-probe.yml/runs?branch=ci/gate-60s&status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].id")
          echo "previous completed run: ${prev:-none}"
          [ -n "$prev" ] && [ "$prev" != "null" ] || exit 0
          gh api -X POST "repos/$REPO/actions/runs/$prev/rerun" -i | head -1
