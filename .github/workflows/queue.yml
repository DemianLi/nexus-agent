name: 排隊合併

on:
  pull_request:
    branches: [develop]
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 只處理這一張 PR（空白：處理所有掛著 queue 的 PR，最舊的先）
        required: false

permissions:
  contents: read

concurrency:
  group: queue-merge
  cancel-in-progress: false

jobs:
  merge:
    name: 排隊合併
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'queue'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # 腳本一律從 develop 取出來跑，不用 PR 的 merge ref：PR 改這支腳本時，不能讓它自己通過自己。
      - uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false

      - name: 處理排隊的 PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ONLY_PR: ${{ github.event.inputs.pr }}
        run: python3 .github/scripts/queue_merge.py $ONLY_PR
