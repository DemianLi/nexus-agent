name: 合併後完整一輪

# 每個合進 develop 的 commit 各跑一輪完整的 ci.yml（不看異動、一律全跑），而且不被下一個 commit 取消，
# 紅了就能指出是哪一張 PR。不擋合併，也不能設成 required check：它只在 push 時跑，PR 上永遠等不到它。
# 紅了怎麼處理見 AGENTS.md「分支策略」。
#
# 這支刻意不設 concurrency：ci.yml 被呼叫時用 sha 當 group、不取消（見 ci.yml 的 concurrency）。
# 呼叫端若設成同一個 group，兩邊會搶同一組。
on:
  push:
    branches: [develop]
  # 手動觸發：跑所選分支最新的 commit（這支檔要先在預設分支上才觸發得了）。要重跑某個舊 commit，到那一輪按 Re-run。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: 完整一輪
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # needs.full.result 是被呼叫那一輪所有 job 的彙總（gate 也在其中）；這裡只把結論對到 commit 與 PR。
  report:
    name: 結果
    needs: full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 寫出 commit 與 PR
        env:
          RESULT: ${{ needs.full.result }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # commit 訊息是外部輸入，經環境變數傳，不用 ${{ }} 內插進 run，免得被當成指令。手動觸發時沒有這個值。
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PULL_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          # squash 合併的標題結尾是 `(#N)`。
          pr=$(printf '%s' "$title" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          pr_ref=${pr:+#$pr}
          if [ -n "$pr" ]; then
            pr_line="[#$pr]($PULL_URL/$pr)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            pr_line="手動觸發（$REF_NAME），沒有對應的 PR"
          else
            pr_line="標題裡沒有 PR 號（$REF_NAME）"
          fi
          {
            echo "### 合併後完整一輪：$RESULT"
            echo ""
            echo "- commit：[\`${SHA:0:8}\`]($COMMIT_URL) ${title:-（手動觸發，沒有 commit 訊息）}"
            echo "- PR：$pr_line"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != "success" ]; then
            echo "::error::完整一輪是 '$RESULT'：commit ${SHA:0:8}，PR ${pr_ref:-不明}。先開撤回 PR，讓 develop 恢復綠，修好再重新開。"
            exit 1
          fi
