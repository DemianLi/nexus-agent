name: CI

on:
  pull_request:
    branches: [develop, main]
    # 需要 edited：標題被格式檢查擋下後，改標題要能重跑 gate。
    types: [opened, synchronize, reopened, edited]
  # push 只留 main：develop 的 push 會與 develop → main 的 PR 落在同一個 sha 上，
  # 產生兩個 gate，合併時要等兩輪。develop 合併後的狀態已由 PR 事件驗證過
  # （develop 開了 strict，PR 必須與 base 同步），所以這個訊號是多餘的。
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 結構：一個 plan job 算出範圍，各項檢查平行跑，最後由名為 `gate` 的彙總 job 收斂成單一 required check。
#
#   plan ─┬─ lint ────────┐
#         ├─ typecheck ───┤
#         ├─ test-packages┤
#         ├─ test-web ────┼─► gate   ← ruleset 綁的 required status check，名稱永遠不要改
#         ├─ test-harness ┤
#         └─ build-web ───┘
#
# 新增檢查：往現有 job 加 step，或新增 job 並把它列進 gate 的 needs 與判斷（不列進去的 job 掛了 gate 也不會紅）。
#
# 選擇性測試只發生在「功能分支 → develop」的 PR 上，判斷邏輯與取捨見 .github/scripts/plan_ci.py。
# `develop → main` 的 PR 與 main 的 push 一律全跑，那是這套對照有漏時的最後保險。
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.plan.outputs.ts }}
      full: ${{ steps.plan.outputs.full }}
      pkg_filters: ${{ steps.plan.outputs.pkg_filters }}
      harness_mode: ${{ steps.plan.outputs.harness_mode }}
      harness_shards: ${{ steps.plan.outputs.harness_shards }}
      harness_shard_total: ${{ steps.plan.outputs.harness_shard_total }}
      web_shards: ${{ steps.plan.outputs.web_shards }}
      web_shard_total: ${{ steps.plan.outputs.web_shard_total }}
      base_sha: ${{ steps.base.outputs.sha }}
      changed_count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 計算異動檔案
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            # three-dot：只看本分支相對於分歧點的異動，不含 base 上的新 commit
            git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" > changed.txt
          else
            git show --pretty="" --name-only "${{ github.sha }}" > changed.txt
          fi
          echo "--- 異動檔案 ---"
          cat changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: 檢查 main 的 PR 來源
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main 只接受來自 develop 的 PR，目前來源為 '$HEAD_REF'。"
            echo "請先把變更合併進 develop，再開 develop → main 的 PR。"
            exit 1
          fi
          echo "PR 來源為 develop，通過。"

      # 標題與內文是外部輸入，一律經環境變數傳給腳本，不經 shell 展開。
      # 規則與可用 type 見 AGENTS.md，實作見 .github/scripts/check_pr.py。
      - name: 檢查 PR 標題與內文
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 .github/scripts/check_pr.py

      - name: 攔截大檔案
        run: |
          set -euo pipefail
          limit=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::檔案 $size bytes 超過 5MB 上限。"
              failed=1
            fi
          done < changed.txt
          exit $failed

      - name: 決定要跑的範圍
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/plan_ci.py plan

      # harness 的選擇性測試要拿「分歧點」當 `vitest --changed` 的基準。
      - name: 計算分歧點
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"

  # Prettier 裝在 root 一次掃全 repo，所以用 root script 而非 pnpm -r；markdown 由 .prettierignore 排除。
  # lint 用 pnpm -r（遞迴進 workspace 套件），不要用 --if-present：
  # --if-present 在 script 不存在時會回綠燈，gate 會變成什麼都沒掃的橡皮圖章。
  # 若所有套件都沒有該 script，pnpm -r 會直接失敗，逼你補上。
  lint:
    name: lint
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm -r run lint

  # 22 個套件逐一啟動 tsc 是冷 runner 上最慢的部分，切成三批平行。
  # 切法必須互補：packages-b 是明列的一批，packages-a 是「packages/ 全部扣掉 b」，
  # 這樣新增的套件不管叫什麼名字都一定落在其中一批，不會有套件沒被型別檢查。
  typecheck:
    name: typecheck (${{ matrix.scope }})
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: apps
            filters: '--filter=./apps/*'
          - scope: packages-a
            filters: '--filter=./packages/* --filter=!./packages/nexus-plugin-[n-z]*'
          - scope: packages-b
            filters: '--filter=./packages/nexus-plugin-[n-z]*'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        env:
          FILTERS: ${{ matrix.filters }}
        # 同 test-packages：刻意不加引號讓 FILTERS 分詞，`set -f` 關掉 glob 交給 pnpm 自己展開。
        run: |
          set -f
          pnpm $FILTERS run typecheck

  # 選擇性時只跑異動到的 plugin 套件；全跑時是 packages/ 底下全部（core、wire 與所有 plugin）。
  # 沒有測試的套件照樣會紅（vitest 找不到測試檔就失敗，見 docs/standards.md）。
  test-packages:
    name: test-packages
    needs: plan
    if: needs.plan.outputs.ts == 'true' && needs.plan.outputs.pkg_filters != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        env:
          PKG_FILTERS: ${{ needs.plan.outputs.pkg_filters }}
        # PKG_FILTERS 由 plan_ci.py 產生（只含 `--filter=./packages/...`），刻意不加引號讓它分詞；
        # `set -f` 關掉 glob，`./packages/*` 要原樣交給 pnpm，不能被 shell 展開。
        run: |
          set -f
          pnpm $PKG_FILTERS run test

  # web 的測試會 fs 讀 plugin 與 harness 的原始碼（todo-view、turn-cancel 等），套件圖上沒有這條邊，
  # 所以有任何 TypeScript 相關異動就跑；它不在關鍵路徑上。
  test-web:
    name: test-web (${{ matrix.shard }}/${{ needs.plan.outputs.web_shard_total }})
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.web_shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.web_shard_total }}
        run: pnpm --filter @nexus/web exec vitest run --shard="$SHARD"

  test-harness:
    name: test-harness (${{ matrix.shard }}/${{ needs.plan.outputs.harness_shard_total }})
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.harness_shards) }}
    env:
      SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.harness_shard_total }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `vitest --changed <sha>` 需要分歧點在本地歷史裡。
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # 基座的 grep 有 rg 就走 rg、沒有就走只比檔名的退路，兩條的行為不同；runner 映像沒預裝 rg，
      # 不裝的話 CI 只驗得到退路。contained-backend-grep.test.ts 的 rg 那組找不到 rg 會紅，不會跳過。
      - name: 安裝 ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep

      - name: Test（全跑）
        if: needs.plan.outputs.harness_mode == 'full'
        run: pnpm --filter @nexus/harness exec vitest run --shard="$SHARD"

      # 相關的測試（vitest --changed）∪ import 圖看不到的必跑集合；挑法與理由見 plan_ci.py。
      - name: Test（只跑相關）
        if: needs.plan.outputs.harness_mode == 'selective'
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plan_ci.py harness-files "$BASE_SHA" > "$RUNNER_TEMP/harness-files.txt"
          echo "--- harness 要跑的測試檔 ---"
          cat "$RUNNER_TEMP/harness-files.txt"
          cd apps/harness
          pnpm exec vitest run --shard="$SHARD" $(cat "$RUNNER_TEMP/harness-files.txt")

  # typecheck 過不代表 build 過：vite plugin、路徑 alias、verbatimModuleSyntax
  # 下的 import 寫法都可能 tsc 綠燈但打包失敗。其他套件的 `build` 就是 `tsc --noEmit`，
  # 與 typecheck 重複，所以只 build 真的會打包的 web。
  build-web:
    name: build-web
    needs: plan
    if: needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm --filter @nexus/web run build

  # 這個 job 的名稱就是 ruleset 綁定的 required status check，永遠不要改。
  #
  # GitHub 把 required check 的 skipped 當成通過，而上游失敗時下游預設是被 skip 而不是變紅，
  # 所以這裡 `if: always()` 並逐個檢查結果：
  #   - plan 必須是 success（它掛了，其餘全 skip，不能因此綠燈）；
  #   - 該跑的 job 必須是 success，failure / cancelled 一律紅；
  #   - 只有 plan 明說「不用掃」時，其餘才允許是 skipped。
  gate:
    name: gate
    needs: [plan, lint, typecheck, test-packages, test-web, test-harness, build-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 彙總
        env:
          PLAN: ${{ needs.plan.result }}
          TS: ${{ needs.plan.outputs.ts }}
          PKG_FILTERS: ${{ needs.plan.outputs.pkg_filters }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST_PACKAGES: ${{ needs.test-packages.result }}
          TEST_WEB: ${{ needs.test-web.result }}
          TEST_HARNESS: ${{ needs.test-harness.result }}
          BUILD_WEB: ${{ needs.build-web.result }}
          CHANGED_COUNT: ${{ needs.plan.outputs.changed_count }}
          HARNESS_MODE: ${{ needs.plan.outputs.harness_mode }}
        run: |
          {
            echo "### gate 結果"
            echo ""
            echo "- 異動檔案數：$CHANGED_COUNT"
            echo "- TypeScript 掃描：${TS:-未知}"
            echo "- harness 測試：${HARNESS_MODE:-未知}"
            echo ""
            echo "| job | 結果 |"
            echo "| --- | --- |"
            echo "| plan | $PLAN |"
            echo "| lint | $LINT |"
            echo "| typecheck | $TYPECHECK |"
            echo "| test-packages | $TEST_PACKAGES |"
            echo "| test-web | $TEST_WEB |"
            echo "| test-harness | $TEST_HARNESS |"
            echo "| build-web | $BUILD_WEB |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail() { echo "::error::$1"; exit 1; }

          [ "$PLAN" = "success" ] || fail "plan 的結果是 '$PLAN'，不是 success；其餘 job 因此不可信。"

          if [ "$TS" = "true" ]; then
            for pair in "lint=$LINT" "typecheck=$TYPECHECK" "test-web=$TEST_WEB" "test-harness=$TEST_HARNESS" "build-web=$BUILD_WEB"; do
              [ "${pair#*=}" = "success" ] || fail "${pair%%=*} 的結果是 '${pair#*=}'，需要 success。"
            done
            if [ -n "$PKG_FILTERS" ]; then
              [ "$TEST_PACKAGES" = "success" ] || fail "test-packages 的結果是 '$TEST_PACKAGES'，需要 success。"
            else
              [ "$TEST_PACKAGES" = "skipped" ] || fail "沒有要測的套件，test-packages 卻是 '$TEST_PACKAGES'。"
            fi
          elif [ "$TS" = "false" ]; then
            echo "本次異動未觸及 TypeScript 相關檔案，略過。"
            for pair in "lint=$LINT" "typecheck=$TYPECHECK" "test-packages=$TEST_PACKAGES" "test-web=$TEST_WEB" "test-harness=$TEST_HARNESS" "build-web=$BUILD_WEB"; do
              [ "${pair#*=}" = "skipped" ] || fail "不需要掃描，${pair%%=*} 卻是 '${pair#*=}'。"
            done
          else
            fail "plan 沒有輸出 ts，無法判斷該跑什麼。"
          fi
