name: CI

on:
  pull_request:
    branches: [develop, main]
    # 不收 edited：只改 PR 內文不重跑、也不取消正在跑的這一輪。改標題、改 base，以及 develop → main 改內文時，
    # 由 pr-edited.yml 重跑這一輪（rerun）。
  # push 只留 main：develop 的 push 會與 develop → main 的 PR 落在同一個 sha 上，產生兩個 gate，合併時要等兩輪。
  # 合進 develop 之後的完整一輪見下方「兩種模式」。
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: 不看異動、一律全跑（post-merge.yml 帶 true）
        type: boolean
        default: false

# 被呼叫時 github.* 是呼叫端的，不帶 sha 的話每個 develop commit 都落在同一個 group；一個 group 只容一輪在跑、
# 一輪排隊，第三輪會取消排隊的那一輪。所以完整一輪的 group 帶 sha，也不取消進行中的。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (inputs.full && github.sha) || github.ref }}
  cancel-in-progress: ${{ !inputs.full }}

# pull-requests：PR 標題與內文從 API 讀當下的值（見 .github/actions/plan-checks）。
permissions:
  contents: read
  pull-requests: read

# 兩種模式，都收斂成 required check `gate`（ruleset 綁的名稱，永遠不要改）。模式由 plan 依異動決定（.github/scripts/plan_ci.py）：
#
#   - 輕的：功能分支 → develop 的 PR。擋合併所需的檢查都在 plan 這一個 job 裡跑完：
#       異動與格式檢查（PR 標題、升級指南、Markdown 連結、大檔）、CI 腳本的測試、lockfile 新版本的發布年齡、
#       受影響套件的型別檢查（改到的與下游，讀合併後那一輪存的快取）、異動檔的 format 與 lint、
#       這次改到的測試檔加上改到的原始檔同名的測試檔。
#   - 全跑：develop → main 的 PR、main 的 push、合進 develop 之後，以及動到 `.github/workflows|scripts|actions` 的功能 PR
#     （改壞了 CI 自己，合併前只有全跑驗得出來）。合進 develop 之後那一輪由 post-merge.yml 帶 `full: true` 呼叫這支，
#     每個 develop commit 一輪、不被下一個 commit 取消、不擋合併；check 名稱帶呼叫端前綴 `完整一輪 / gate`，
#     跟 required 的 `gate` 不同名。這一輪的 typecheck 把 buildinfo 與宣告檔存成快取，給輕的模式讀。
#
# 全跑的結構：plan 算出模式與要不要掃，各項檢查平行跑，最後由 gate 收斂成單一 required check。
# 輕的模式，中間那一段整排 skipped，gate 照 plan 輸出的模式接受它們 skipped。
#
#   plan ─┬─ static ───────────┐   CI 腳本的測試、format、lint、web build、web 的瀏覽器護欄
#         ├─ typecheck ────────┤
#         ├─ test-packages ────┤
#         ├─ test-web ─────────┼─► gate
#         ├─ test-harness ─────┤   兩片
#         ├─ node-compat ──────┤   Node 下限 22.19 與下一版 26 各跑一輪相容冒煙，依序跑（#1546）
#         ├─ sandbox-spawner ──┤   Rust 的沙箱 spawner（#1946）。不看模式，看 plan 的 rust：輕的模式也會跑
#         │  └ packed-install ─┤   接在 spawner 後面：打成 tarball（帶 spawner 的 bundle）、在 repo 外解開、用純 node 起來（#1502 刀 2＋3）
#         └─ sandbox-spawner-arm64 ┘ 只在合併後完整一輪：arm64 的 spawner 只編、只測，不出貨（#1946）
#
# job 數是有代價的：免費額度同時只跑 20 個 job。全跑一輪的峰值是中間那一段：
# static 1 ＋ typecheck 1 ＋ test-packages 1 ＋ test-web 1 ＋ test-harness 2 ＋ node-compat 1（`max-parallel: 1`，兩格依序跑）
# ＋ sandbox-spawner 接 packed-install 1（依序，同時只有一個）＋ sandbox-spawner-arm64 1 ＝ 9。plan 在它之前、gate 在它之後，不同時。
# 輕的一輪是 plan 接 gate（動到 spawner 時中間多一個 sandbox-spawner），依序跑，同時只有 1 個，
# 所以合併後的一輪加上兩張功能 PR 同時跑是 9 ＋ 1 ＋ 1 ＝ 11，在 20 之內。
# 這兩個算式由 .github/scripts/test_ci_workflow.py 釘住，加 job 或加矩陣格時它會紅。
#
# 新增檢查：往現有 job 加 step，或新增 job 並把它列進 gate 的 needs 與判斷（不列進去的 job 掛了 gate 也不會紅）。
# 擋合併的檢查要另外加進 plan 的輕的那一段，否則功能 PR 上不會跑。
#
# job 只掛寬鬆的 `timeout-minutes` 防卡死，不拿時限當速度門檻（#2088 決議第 11 條）。
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      ts: ${{ steps.plan.outputs.ts }}
      rust: ${{ steps.plan.outputs.rust }}
      base_sha: ${{ steps.base.outputs.sha }}
      changed_count: ${{ steps.checks.outputs.count }}
      affected: ${{ steps.light.outputs.affected }}
      durations_key_1: ${{ steps.durations-1.outputs.cache-matched-key }}
      durations_key_2: ${{ steps.durations-2.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/plan-checks
        id: checks

      - name: 決定模式與範圍
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FORCE_FULL: ${{ inputs.full }}
        run: python3 .github/scripts/plan_ci.py plan

      # lockfile 發布年齡檢查與輕的模式的快取拿「分歧點」當基準。
      - name: 計算分歧點
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"

      # 全跑時 test-harness 兩片要讀的耗時（#2093）：合併後那一輪每片各存一份，這裡只查鍵、不下載。PR 先找分歧點那一份，
      # 沒有（或不是 PR）就退回最近的一份；都沒有時（GitHub 會清掉 7 天沒人取的快取）兩片退回 vitest 的雜湊切法。
      # 兩片拿這裡查到的同一個鍵去取，讀到的是同一份資料，切法才一致。
      - uses: actions/cache/restore@v6
        id: durations-1
        if: steps.plan.outputs.mode == 'full'
        with:
          path: .harness-durations/results-1.json
          key: harness-durations-1-${{ steps.base.outputs.sha || github.sha }}
          restore-keys: harness-durations-1-
          lookup-only: true

      - uses: actions/cache/restore@v6
        id: durations-2
        if: steps.plan.outputs.mode == 'full'
        with:
          path: .harness-durations/results-2.json
          key: harness-durations-2-${{ steps.base.outputs.sha || github.sha }}
          restore-keys: harness-durations-2-
          lookup-only: true

      # 以下是輕的模式：擋合併所需的檢查都在這個 job 跑完，中間那一段整排 skipped。

      # CI 形狀測試等（#1546）。不用安裝相依，秒級。
      - name: CI 腳本的測試
        if: steps.plan.outputs.mode == 'light'
        run: python3 -m unittest discover -s .github/scripts

      # lockfile 新帶進的版本要發布滿 `minimumReleaseAge`（#1545），規則見腳本檔頭。排在安裝之前；lockfile 沒變就不發請求。
      - name: lockfile 新版本的發布年齡
        if: steps.plan.outputs.mode == 'light'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 .github/scripts/check_lockfile_age.py "$BASE_SHA"

      - name: 決定輕的範圍
        id: scope
        if: steps.plan.outputs.mode == 'light'
        run: python3 .github/scripts/plan_ci.py light "$RUNNER_TEMP/light"

      - uses: ./.github/actions/setup
        if: steps.plan.outputs.mode == 'light' && steps.scope.outputs.node == 'true'

      # 合併後那一輪替每個 develop commit 存一份；先找分歧點那一份，沒有（那一輪還沒存好）就退回最近的一份。
      # 快取落後的部分 tsc 會比對 hash 重查，只影響快慢，不影響結果。
      - uses: actions/cache/restore@v6
        if: steps.plan.outputs.mode == 'light' && steps.scope.outputs.typecheck == 'true'
        with:
          path: |
            packages/*/node_modules/.cache/nexus-typecheck
            apps/*/node_modules/.cache/nexus-typecheck
          key: typecheck-${{ steps.base.outputs.sha }}
          restore-keys: typecheck-

      # 四件事同時跑，各自的輸出收進檔案、跑完依序印成折疊群組；任何一件失敗整個 step 就紅。
      # 測試檔以 vitest 的檔名篩選交給各套件；選到的檔不在該套件 vitest 的 include 裡時，vitest 以找不到測試檔失敗。
      - name: 型別檢查、format、lint、測試
        id: light
        if: steps.plan.outputs.mode == 'light' && steps.scope.outputs.node == 'true'
        run: |
          L="$RUNNER_TEMP/light"
          run() {
            local name="$1" rc=0 start=$SECONDS; shift
            "$@" > "$RUNNER_TEMP/$name.log" 2>&1 || rc=$?
            echo $rc > "$RUNNER_TEMP/$name.rc"; echo $((SECONDS - start)) > "$RUNNER_TEMP/$name.sec"
          }
          # $1 是「目錄<TAB>檔」的清單，其餘是指令：每個目錄各跑一次，檔接在指令後面。
          per_dir() {
            local tsv="$1" rc=0 d; shift
            mapfile -t dirs < <(cut -f1 "$tsv" | sort -u)
            for d in "${dirs[@]}"; do
              mapfile -t files < <(awk -F'\t' -v d="$d" '$1 == d { print $2 }' "$tsv")
              echo "--- $d：${files[*]}"
              (cd "$d" && pnpm exec "$@" "${files[@]}") || rc=1
            done
            return $rc
          }
          typecheck() {
            [ -s "$L/typecheck.txt" ] || { echo "沒有受影響的套件"; return 0; }
            mapfile -t filters < "$L/typecheck.txt"
            pnpm "${filters[@]}" --silent exec pwd | wc -l | tr -d ' ' > "$RUNNER_TEMP/affected.txt"
            .github/scripts/typecheck.sh "${filters[@]}"
          }
          format() {
            [ -s "$L/format.txt" ] || { echo "沒有要檢查的檔"; return 0; }
            mapfile -t files < "$L/format.txt"
            pnpm exec prettier --check --ignore-unknown "${files[@]}"
          }
          lint() {
            [ -s "$L/lint.tsv" ] || { echo "沒有要檢查的檔"; return 0; }
            pnpm run build:lib && per_dir "$L/lint.tsv" eslint --no-warn-ignored
          }
          tests() {
            [ -s "$L/tests.tsv" ] || { echo "沒有要跑的測試檔"; return 0; }
            per_dir "$L/tests.tsv" vitest run
          }
          run typecheck typecheck &
          run format format &
          run lint lint &
          run tests tests &
          wait
          echo "affected=$(cat "$RUNNER_TEMP/affected.txt" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          rc=0
          echo "| 檢查 | exit | 秒 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for name in typecheck format lint tests; do
            echo "::group::$name（$(cat "$RUNNER_TEMP/$name.sec") 秒）"; cat "$RUNNER_TEMP/$name.log"; echo "::endgroup::"
            echo "| $name | $(cat "$RUNNER_TEMP/$name.rc") | $(cat "$RUNNER_TEMP/$name.sec") |" >> "$GITHUB_STEP_SUMMARY"
            [ "$(cat "$RUNNER_TEMP/$name.rc")" = "0" ] || { echo "::error::$name 失敗"; rc=1; }
          done
          exit $rc

  # Prettier 裝在 root 一次掃全 repo，所以用 root script 而非 pnpm -r；markdown 由 .prettierignore 排除。
  # lint 用 pnpm -r（遞迴進 workspace 套件），不要用 --if-present：
  # --if-present 在 script 不存在時會回綠燈，gate 會變成什麼都沒掃的橡皮圖章。
  # 若所有套件都沒有該 script，pnpm -r 會直接失敗，逼你補上。
  #
  # build 併在這一個 job：typecheck 過不代表 build 過（vite plugin、路徑 alias、verbatimModuleSyntax
  # 下的 import 寫法都可能 tsc 綠燈但打包失敗），但它自己只要幾秒，獨立成 job 只是多付一次安裝。
  # 其他套件的 `build` 就是 `tsc --noEmit`，與 typecheck 重複，所以只 build 真的會打包的 web。
  static:
    name: static
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # lockfile 新帶進的版本要發布滿 `minimumReleaseAge`（#1545）：pnpm 10 的 `--frozen-lockfile` 不再查已進 lockfile 的版本，
      # 規則與偏離理由見腳本檔頭。排在安裝之前：它只要 Python 與網路，太新的版本要紅在這一步，而不是被別的原因擋掉。
      # lockfile 沒變就不發請求。只在 PR 上跑：main 的 push 帶的 lockfile 已經在 develop 的 PR 上查過。
      - name: lockfile 新版本的發布年齡
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 .github/scripts/check_lockfile_age.py "$BASE_SHA"
      - uses: ./.github/actions/setup
      # `.github/scripts/` 的 Python 測試（`test_*.py`），例如 CI 形狀測試（#1546）。秒級，放最前面。
      - name: CI 腳本的測試
        run: python3 -m unittest discover -s .github/scripts -v
      # 編成 `lib/`（#1502）：各插件的 `eslint.config.js` 用 Node 原生載入 `@nexus/sdk/lint`，指到 `lib/lint.js`，所以 lint 之前要先建置。
      # 順便驗三件事（秒級，都不需要網路）：paths 產生器沒漂移、每個 manifest 都指 `lib/`、編出來的三個入口純 `node` 起得來
      # （含經符號連結啟動，比路徑的入口檢查在那裡會靜靜以 0 結束）。
      - name: 建置 lib 並驗 manifest
        run: |
          pnpm run build:lib
          pnpm run verify-tsconfig-paths
          pnpm run verify-lib-manifests
          pnpm run smoke-built-bin
      # 三件事互不依賴、在四核 runner 上同時跑，各自的輸出收進檔案、跑完依序印成折疊群組；任何一件失敗整個 step 就紅。
      - name: Format、Lint、Build
        run: |
          run() { local name="$1"; shift; "$@" > "$RUNNER_TEMP/$name.log" 2>&1; echo $? > "$RUNNER_TEMP/$name.rc"; }
          run format pnpm run format:check &
          run lint pnpm -r run lint &
          run build pnpm --filter @nexus/web run build &
          wait
          rc=0
          for name in format lint build; do
            echo "::group::$name"; cat "$RUNNER_TEMP/$name.log"; echo "::endgroup::"
            [ "$(cat "$RUNNER_TEMP/$name.rc")" = "0" ] || { echo "::error::$name 失敗"; rc=1; }
          done
          exit $rc

      # web 的瀏覽器護欄（#1512）：用真的 Chrome 量上一步 build 出來的 dist 上元件的計算值（焦點、合成後的對比、亮色陰影）。
      # 掛在 static 而不是另開 job：產物已經在這裡，不多付一次安裝，gate 也不用改。上一步紅了這一步不跑，job 照樣是紅的。
      # ubuntu-latest 自帶 Chrome，playwright-core 用 channel 'chrome' 開它，不另外下載瀏覽器。
      - name: 瀏覽器護欄
        run: pnpm --filter @nexus/web run test:guard

  # 產物驗證（#1502）：每次全跑都跑 pack 與安裝驗證，不只在發版時。
  # `pnpm deploy --prod` 打成 tar.gz → 在 repo 外解開 → 純 node 驗 sha256、靜態檢查、`--version`、flock、會話 header 的戳記、
  # serve 起得來並回 200、SIGTERM exit 0。**解開後不再跑任何 install**，所以整段沒有一步會連 registry。
  # Node 鎖在 manifest `engines` 的下限 22.19.0，不跟 setup 的主版本 24：下限才是我們對使用者承諾的最低版本。
  # 這裡是下限上的「已安裝產物」冒煙；同一個下限上的「原始碼」冒煙在 node-compat 的 22.19 那一格。兩邊的版本由
  # .github/scripts/test_ci_workflow.py 對著 `engines` 釘住。
  # 只在動到 TypeScript 相關檔案時跑（同 static）；`.github/workflows/`、`.github/scripts/` 的異動 plan 也算進去。
  # 包裡的 spawner 用 sandbox-spawner 這一輪編好、測過的那一份，這裡不編 Rust。plan 保證這個 job 要跑時 rust 為 true。
  packed-install:
    name: packed-install
    needs: [plan, sandbox-spawner]
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: sandbox-spawner-linux-x64
          path: ${{ runner.temp }}
      - name: 解開沙箱 spawner 的 bundle
        run: mkdir "$RUNNER_TEMP/spawner" && tar -xf "$RUNNER_TEMP/spawner-bundle.tar" -C "$RUNNER_TEMP/spawner"
      - name: 打包
        run: pnpm run release:pack --spawner "$RUNNER_TEMP/spawner"
      - name: 核對 sha256
        working-directory: .release-out
        run: sha256sum -c ./*.sha256
      - name: 在 repo 外解開並驗證
        run: pnpm run release:verify-packed-install .release-out/*.tar.gz --expect-commit "$(git rev-parse HEAD)"

  # Node 相容冒煙（#1546）：主版本 24 由其他 job 全套覆蓋，這裡在 `engines` 的下限 22.19 與下一版 26 各跑一輪，
  # 只跑行為隨 Node 版本而變的那幾處（清單與每一檔測什麼見 .github/scripts/node-compat-files.txt）。
  # 照 dsh `ci.yml:393-485`：`fail-fast: false`、`max-parallel: 1`（依序跑，同一時間只佔一個 runner）。
  #
  # 矩陣不收 dsh 的 24.9：dsh 釘它是為了 24.0～24.11 帶的 v1 內部 loader。nexus 的 vendor loader 只有在行程帶
  # `--expose-internals` 或裝了 `node-addon-require-builtin` 時才碰內部 loader（`vendor/loader/src/internal.ts:99-108`），
  # 今天兩個都沒有，24.9 那格測不到東西。哪天加了其中一個，就把 24.9 補回矩陣。
  #
  # 22.19 那一格只跑原始碼冒煙。下限上的「已安裝產物」冒煙由 packed-install 負責（它的 Node 鎖在 22.19.0），不在這裡重跑。
  node-compat:
    name: node-compat (${{ matrix.node }})
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # 加引號：不加的話 YAML 把它讀成數字，22.10 會變成 22.1。
        node: ['22.19', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # setup 沒把版本接上時，兩格會靜靜跑同一版（主版本）還全綠，所以先核對。
      - name: 核對 Node 版本
        env:
          EXPECTED: ${{ matrix.node }}
        run: |
          actual=$(node -v)
          echo "node: $actual（矩陣：$EXPECTED）"
          case "$actual" in
            "v$EXPECTED".*) ;;
            *) echo "::error::Node 是 $actual，矩陣要的是 $EXPECTED"; exit 1 ;;
          esac
      - name: 相容冒煙
        run: python3 .github/scripts/node_compat.py smoke
      # 插件的 `eslint.config.js` 由 Node 原生載入 ESM 設定鏈（`@nexus/sdk/lint` 指到 `lib/lint.js`，所以先建 lib）。
      - name: 插件 lint 設定的載入
        run: |
          pnpm run build:lib
          pnpm --filter @nexus/plugin-echo run lint

  # 從零查全部套件，不讀快取：全跑是對照組。合併後那一輪查完把 buildinfo 與宣告檔存成快取，key 是這個 develop commit，
  # 輕的模式用 PR 的分歧點去取（develop 是 strict，合併前最後一輪的分歧點就是最新的 develop）。
  typecheck:
    name: typecheck
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: .github/scripts/typecheck.sh '--filter=./packages/*' '--filter=./apps/*'
      - name: 存型別檢查快取
        if: inputs.full
        uses: actions/cache/save@v6
        with:
          path: |
            packages/*/node_modules/.cache/nexus-typecheck
            apps/*/node_modules/.cache/nexus-typecheck
          key: typecheck-${{ github.sha }}

  # 沒有測試的套件照樣會紅（vitest 找不到測試檔就失敗，見 docs/standards.md）。
  test-packages:
    name: test-packages
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm '--filter=./packages/*' '--filter=./vendor/*' run test

  test-web:
    name: test-web
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm --filter @nexus/web run test

  # harness 是關鍵路徑，切兩片平行跑；web 一片就比 harness 的一片短，不分。
  # 分片看上一輪的耗時（#2093，`apps/harness/src/test-shard-sequencer.ts`）：plan 查到鍵就取那兩份，跑完由合併後那一輪各片存回自己這一份。
  # plan 沒查到鍵時兩片都退回 vitest 的雜湊切法；plan 查到了、這一片卻取不到就紅，不會一片看耗時、一片看雜湊而漏跑檔。
  test-harness:
    name: test-harness (${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        if: needs.plan.outputs.durations_key_1 != ''
        with:
          path: .harness-durations/results-1.json
          key: ${{ needs.plan.outputs.durations_key_1 }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        if: needs.plan.outputs.durations_key_2 != ''
        with:
          path: .harness-durations/results-2.json
          key: ${{ needs.plan.outputs.durations_key_2 }}
          fail-on-cache-miss: true
      - name: Test
        env:
          NEXUS_TEST_DURATIONS_DIR: ${{ github.workspace }}/.harness-durations
        run: pnpm --filter @nexus/harness exec vitest run --shard="${{ matrix.shard }}/2"
      # vitest 跑完把這一片每個檔的耗時寫進自己的結果快取；CI 的 node_modules 是新裝的，裡面只有這一片的檔。測試紅了也存。
      - name: 收這一片的耗時
        if: inputs.full && !cancelled()
        run: |
          mkdir -p .harness-durations
          cp apps/harness/node_modules/.vite/vitest/*/results.json ".harness-durations/results-${{ matrix.shard }}.json"
      - name: 存這一片的耗時
        if: inputs.full && !cancelled()
        uses: actions/cache/save@v6
        with:
          path: .harness-durations/results-${{ matrix.shard }}.json
          key: harness-durations-${{ matrix.shard }}-${{ github.sha }}

  # 沙箱 spawner（#1946，`native/sandbox-spawner/`）：Rust，在真的核心上跑整合測試，再用編好的執行檔跑 TS 那一側。plan 的 `rust` 決定跑不跑，跟模式無關：
  # 動到它、TS 那一側的接縫與 client 或 CI 自己的功能 PR（輕的模式也跑，#1827 D55：接受超過 60 秒）、packed-install 要跑的一輪（並打 bundle 給它）與合併後完整一輪。
  # 核心沒有 Landlock 時測試紅，不准自我跳過。
  sandbox-spawner:
    name: sandbox-spawner
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sandbox-spawner
        with:
          bundle: ${{ needs.plan.outputs.mode == 'full' && needs.plan.outputs.ts == 'true' && 'sandbox-spawner-linux-x64' || '' }}
      - uses: ./.github/actions/setup
      - name: 真的 spawner 跑整合測試
        run: pnpm --filter @nexus/harness exec vitest run src/sandbox-spawner.integration src/git-sandbox.integration src/mcp-sandbox.integration
        env:
          NEXUS_SPAWNER_BIN: ${{ github.workspace }}/native/sandbox-spawner/target/${{ env.SPAWNER_TARGET }}/release/nexus-sandbox-spawner

  # arm64 的 spawner 只在合併後完整一輪編與測（#1827 D55），不進包、不掛 Release（#1946 issuecomment-6508052433）。
  # 用 GitHub 的 arm64 runner 原生編，不交叉編譯：同一台機器順便在 aarch64 的真核心上跑整合測試。
  sandbox-spawner-arm64:
    name: sandbox-spawner-arm64
    needs: plan
    if: inputs.full
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sandbox-spawner
      - uses: ./.github/actions/setup
      - name: 真的 spawner 跑整合測試
        run: pnpm --filter @nexus/harness exec vitest run src/sandbox-spawner.integration src/git-sandbox.integration src/mcp-sandbox.integration
        env:
          NEXUS_SPAWNER_BIN: ${{ github.workspace }}/native/sandbox-spawner/target/${{ env.SPAWNER_TARGET }}/release/nexus-sandbox-spawner

  # 這個 job 的名稱就是 ruleset 綁定的 required status check，永遠不要改。
  #
  # GitHub 把 required check 的 skipped 當成通過，而上游失敗時下游預設是被 skip 而不是變紅，
  # 所以這裡 `if: always()` 並逐個檢查結果：
  #   - plan 必須是 success（它掛了，其餘全 skip，不能因此綠燈；輕的模式的檢查也在它裡面）；
  #   - 該跑的 job 必須是 success，failure / cancelled 一律紅；
  #   - 只有 plan 明說「輕的模式」或「不用掃」時，其餘才允許是 skipped。
  gate:
    name: gate
    needs:
      [
        plan,
        static,
        typecheck,
        test-packages,
        test-web,
        test-harness,
        packed-install,
        node-compat,
        sandbox-spawner,
        sandbox-spawner-arm64,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 彙總
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          TS: ${{ needs.plan.outputs.ts }}
          AFFECTED: ${{ needs.plan.outputs.affected }}
          STATIC: ${{ needs.static.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST_PACKAGES: ${{ needs.test-packages.result }}
          TEST_WEB: ${{ needs.test-web.result }}
          TEST_HARNESS: ${{ needs.test-harness.result }}
          PACKED_INSTALL: ${{ needs.packed-install.result }}
          NODE_COMPAT: ${{ needs.node-compat.result }}
          RUST: ${{ needs.plan.outputs.rust }}
          SANDBOX_SPAWNER: ${{ needs.sandbox-spawner.result }}
          FULL: ${{ inputs.full }}
          SANDBOX_SPAWNER_ARM64: ${{ needs.sandbox-spawner-arm64.result }}
          CHANGED_COUNT: ${{ needs.plan.outputs.changed_count }}
        run: |
          {
            echo "### gate 結果"
            echo ""
            echo "- 模式：${MODE:-未知}"
            echo "- 異動檔案數：$CHANGED_COUNT"
            echo "- 受影響套件數（含下游，輕的模式才有）：${AFFECTED:-0}"
            echo "- TypeScript 掃描：${TS:-未知}"
            echo ""
            echo "| job | 結果 |"
            echo "| --- | --- |"
            echo "| plan | $PLAN |"
            echo "| static | $STATIC |"
            echo "| typecheck | $TYPECHECK |"
            echo "| test-packages | $TEST_PACKAGES |"
            echo "| test-web | $TEST_WEB |"
            echo "| test-harness | $TEST_HARNESS |"
            echo "| packed-install | $PACKED_INSTALL |"
            echo "| node-compat | $NODE_COMPAT |"
            echo "| sandbox-spawner | $SANDBOX_SPAWNER |"
            echo "| sandbox-spawner-arm64 | $SANDBOX_SPAWNER_ARM64 |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail() { echo "::error::$1"; exit 1; }

          [ "$PLAN" = "success" ] || fail "plan 的結果是 '$PLAN'，不是 success；其餘 job 因此不可信。"

          if [ "$MODE" = "full" ] && [ "$TS" = "true" ]; then
            for pair in "static=$STATIC" "typecheck=$TYPECHECK" "test-packages=$TEST_PACKAGES" "test-web=$TEST_WEB" "test-harness=$TEST_HARNESS" "packed-install=$PACKED_INSTALL" "node-compat=$NODE_COMPAT"; do
              [ "${pair#*=}" = "success" ] || fail "${pair%%=*} 的結果是 '${pair#*=}'，需要 success。"
            done
          elif [ "$MODE" = "light" ] || { [ "$MODE" = "full" ] && [ "$TS" = "false" ]; }; then
            echo "輕的模式，或本次異動未觸及 TypeScript 相關檔案：其餘 job 不跑。"
            for pair in "static=$STATIC" "typecheck=$TYPECHECK" "test-packages=$TEST_PACKAGES" "test-web=$TEST_WEB" "test-harness=$TEST_HARNESS" "packed-install=$PACKED_INSTALL" "node-compat=$NODE_COMPAT"; do
              [ "${pair#*=}" = "skipped" ] || fail "不需要跑，${pair%%=*} 卻是 '${pair#*=}'。"
            done
          else
            fail "plan 輸出的模式是 '$MODE'、ts 是 '$TS'，無法判斷該跑什麼。"
          fi

          # sandbox-spawner 不看模式，看 plan 的 rust。
          if [ "$RUST" = "true" ]; then
            [ "$SANDBOX_SPAWNER" = "success" ] || fail "sandbox-spawner 的結果是 '$SANDBOX_SPAWNER'，需要 success。"
          elif [ "$RUST" = "false" ]; then
            [ "$SANDBOX_SPAWNER" = "skipped" ] || fail "不需要跑，sandbox-spawner 卻是 '$SANDBOX_SPAWNER'。"
          else
            fail "plan 輸出的 rust 是 '$RUST'，無法判斷 sandbox-spawner 該不該跑。"
          fi

          if [ "$FULL" = "true" ]; then
            [ "$SANDBOX_SPAWNER_ARM64" = "success" ] || fail "sandbox-spawner-arm64 的結果是 '$SANDBOX_SPAWNER_ARM64'，需要 success。"
          else
            [ "$SANDBOX_SPAWNER_ARM64" = "skipped" ] || fail "不是合併後完整一輪，sandbox-spawner-arm64 卻是 '$SANDBOX_SPAWNER_ARM64'。"
          fi
