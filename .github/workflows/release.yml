# 注意：GitHub 只在「推送到 default branch 且此檔有異動」時登錄 workflow_dispatch。
# 若 Actions 頁面看不到這個 workflow，對本檔做一次異動並合併進 develop 即可重新登錄。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版號，格式 vX.Y.Z（例如 v0.1.0）'
        required: true
        type: string
      prerelease:
        description: '標記為 pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 第一道防線：workflow_dispatch 選到 main 以外的分支就直接停，其他 job 都等它。
  # 這讓「main 是唯一發佈途徑」成為機制保證，而不是靠約定。
  branch:
    name: branch
    runs-on: ubuntu-latest
    steps:
      - name: 確認執行分支為 main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release 只能在 main 上執行，目前為 ${{ github.ref }}。"
            exit 1
          fi

  # 沙箱 spawner（#1946）：x64 編、測、打 bundle 給下面打包；arm64 只編與測，不進包、不掛 Release（#1946 issuecomment-6508052433）。
  # 跟 ci.yml 同一個 action，各在自己架構的 runner 上原生編。
  sandbox-spawner:
    name: sandbox-spawner
    needs: branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sandbox-spawner
        with:
          bundle: sandbox-spawner-linux-x64

  sandbox-spawner-arm64:
    name: sandbox-spawner-arm64
    needs: branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sandbox-spawner

  release:
    name: release
    needs: [branch, sandbox-spawner, sandbox-spawner-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 驗證版號格式與重複
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版號格式錯誤：$VERSION（應為 vX.Y.Z）"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION 已存在。"
            exit 1
          fi

      # 以下三步（pnpm、Node、相依）與 ci.yml 的 packed-install 同一套（#1502 刀 2＋3）：Node 鎖在 engines 的下限，產物不帶 node。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      # 版號從 manifest 讀（Q4 (a)）：輸入的 vX.Y.Z 只拿來核對兩者相同。要發的版號先用 `pnpm run release:bump` 寫進
      # manifest、走一張版號 PR 合進來，再到這裡發版。CI 從不寫 repo。
      - name: 核對輸入的版號等於 manifest
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm run release:version --expect "$VERSION"

      # 漏洞掃描（#1545 步驟 5，Q1 (a)）：prod 相依有 high／critical 又不在 `.github/audit-exceptions.json` 上就停，不打包。
      # 判斷與每日排程（`audit.yml`）同一支。結果（audit 原始輸出＋這次用到的例外清單）配一份 `.sha256` 附在 Release 上。
      - name: 漏洞掃描
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          report="nexus-agent-${VERSION#v}-audit.json"
          python3 .github/scripts/check_audit.py --out ".release-out/$report"
          (cd .release-out && sha256sum "$report" > "$report.sha256")

      - uses: actions/download-artifact@v8
        with:
          name: sandbox-spawner-linux-x64
          path: ${{ runner.temp }}
      - name: 解開沙箱 spawner 的 bundle
        run: mkdir "$RUNNER_TEMP/spawner" && tar -xf "$RUNNER_TEMP/spawner-bundle.tar" -C "$RUNNER_TEMP/spawner"

      - name: 打包
        run: pnpm run release:pack --spawner "$RUNNER_TEMP/spawner"

      - name: 核對 sha256
        working-directory: .release-out
        run: sha256sum -c ./*.sha256

      - name: 在 repo 外解開並驗證
        run: pnpm run release:verify-packed-install .release-out/*.tar.gz --expect-commit "${{ github.sha }}"

      # 不自己 git tag：runner 沒有 committer 身分，git tag -a 會 exit 128。
      # gh release create 會依 --target 自行建立 tag，少一段 git 操作也少一個失敗點。
      # 產物（tar.gz、SBOM 的 .cdx.json、漏洞掃描結果的 -audit.json，各配一份 .sha256，#1545）附在 Release 上；沒有 npm publish（理由 2：完全內網，沒有 registry 可用）。
      # 上一個 tag 有升級指南目錄（AGENTS.md「發版」〈升級指南〉，#1537）就在 notes 開頭連過去：`--notes` 與 `--generate-notes`
      # 並用時，生成的內容接在後面。上一個 tag 取這次 commit 往回最近的 `v*`，新 tag 這時還沒建，所以就是讀者正在跑的那一版。
      - name: 建立 tag 與 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          notes=()
          if [ -n "$prev" ] && [ -d "docs/upgrade-guide/$prev" ]; then
            notes=(--notes "從 $prev 升上來之前，先讀[升級指南](https://github.com/$REPO/tree/$VERSION/docs/upgrade-guide/$prev)，並照[〈升級與回滾〉](https://github.com/$REPO/blob/$VERSION/docs/operations.md#升級與回滾)先備份 home。")
          fi
          gh release create "$VERSION" \
            .release-out/*.tar.gz .release-out/*.cdx.json .release-out/*-audit.json .release-out/*.sha256 \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            ${notes[@]+"${notes[@]}"} \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
