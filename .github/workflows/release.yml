# 注意：GitHub 只在「推送到 default branch 且此檔有異動」時登錄 workflow_dispatch。
# 若 Actions 頁面看不到這個 workflow，對本檔做一次異動並合併進 develop 即可重新登錄。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版號，格式 vX.Y.Z（例如 v0.1.0）'
        required: true
        type: string
      prerelease:
        description: '標記為 pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # 第一道防線：workflow_dispatch 選到 main 以外的分支就直接停。
      # 這讓「main 是唯一發佈途徑」成為機制保證，而不是靠約定。
      - name: 確認執行分支為 main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release 只能在 main 上執行，目前為 ${{ github.ref }}。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 驗證版號格式與重複
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版號格式錯誤：$VERSION（應為 vX.Y.Z）"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION 已存在。"
            exit 1
          fi

      - name: 建立 tag 與 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
