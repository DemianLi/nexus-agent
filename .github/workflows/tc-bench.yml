name: 暫時：型別檢查量測
# #2090 第 1 條的量測，開 PR 前拿掉。
on:
  push:
    branches: [ci/gate-60s]
permissions:
  contents: read
jobs:
  bench:
    name: bench ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: 量測
        # 腳本會切到舊 commit，先複製出去，免得 bash 讀到一半檔案不見。
        run: cp .github/scripts/tc_bench.sh "$RUNNER_TEMP/" && "$RUNNER_TEMP/tc_bench.sh"
