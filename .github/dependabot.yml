# 版本更新（排程式）。安全性更新是 repo 設定，不由本檔控制，且早已啟用。
# 只開 github-actions：全 repo 只有 4 行 uses，major 一年動幾次，噪音低。
# npm 暫不開 —— apps/harness 還在 spike 階段（issue #33 未解），
# 這時候讓機器人動 LangChain 全家桶的版本，噪音會蓋過訊號。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # 預設分支現在就是 develop，這行是冗餘的。但預設分支若哪天翻成 main，
    # dependabot 會靜默改指向，接著每張機器人 PR 都會撞上 ci.yml 的
    # 「main 只接受來自 develop 的 PR」硬失敗。一行換掉一個靜默故障模式。
    target-branch: develop
    schedule:
      interval: monthly
    # develop 只允許 squash，PR 標題會原封不動成為 develop 上的 commit 標題。
    # dependabot 的標題是英文，靠 check_pr.py 的 bot 豁免通過 gate；prefix 讓
    # type 先對上 AGENTS.md 的格式，中文描述在合併前手改（ci.yml 有 edited
    # 觸發，改完標題會自動重跑 gate）。
    commit-message:
      prefix: chore
    # 併成一張：develop 開了 strict，每合一張其餘都要重 rebase 再跑一輪 gate。
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
