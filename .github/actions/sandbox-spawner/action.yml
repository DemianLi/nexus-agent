name: 沙箱 spawner
description: >-
  編沙箱 spawner（#1946，`native/sandbox-spawner/`，是個 workspace：spawner 與監督行程一個 package，宿主在 `host/` 另一個）並在這台 runner 的核心上跑整合測試：裝 rust-toolchain.toml 釘住的 Rust
  與這台架構的 musl target，跑 `cargo fmt --all --check` 與 clippy（警告即錯），編出貨的 release 版（靜態連結 musl），再用 test-hooks 跑測試（核心沒有 Landlock 時紅，不准自我跳過）。
  給了 `bundle` 就把 release 執行檔與連進去的程式碼的授權全文打成 bundle（`bundle.sh`），包成 tar 上傳：upload-artifact 不保留
  執行權限，tar 保留。
  ci.yml 與 release.yml 共用。

inputs:
  cache:
    description: 從快取還原 cargo 的 registry 與 target/；'false' 就不還原也不存
    required: false
    default: 'true'
  bundle:
    description: bundle 上傳成的 artifact 名；空的就不打 bundle
    required: false
    default: ''
  per-thread-binaries:
    description: >-
      release 版的 nexus-supervisor 與 nexus-host 包成 tar 上傳成的 artifact 名（#2657：packed-install 照產物起 per-thread 用）；
      空的就不上傳。只給 CI 驗證用，不進出貨的 bundle（產物不帶監督行程與宿主，見 operations.md〈行程模型〉）
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: 安裝釘住的 Rust
      shell: bash
      working-directory: native/sandbox-spawner
      run: |
        rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal \
          --component clippy --component rustfmt --target "$(uname -m)-unknown-linux-musl"
        echo "SPAWNER_TARGET=$(uname -m)-unknown-linux-musl" >> "$GITHUB_ENV"
    # 宿主的 TLS 用 ring（#2570），ring 有 C 與組語要編；musl target 的 C 編譯器用 musl-gcc。
    - name: 安裝 musl-gcc
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
        echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          native/sandbox-spawner/target
        key: sandbox-spawner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/sandbox-spawner/Cargo.lock', 'native/sandbox-spawner/rust-toolchain.toml') }}
    - name: 核心與 LSM
      shell: bash
      run: |
        uname -r
        cat /sys/kernel/security/lsm
    # fmt 紅了 clippy 照樣跑：一輪看得到兩邊的輸出。根是 package，cargo 預設只動它，所以編、測、查的每個 cargo 步驟都要涵蓋整個 workspace（fmt 用 `--all`，其餘用 `--workspace`）；bundle 只收 spawner。
    - name: 格式
      shell: bash
      working-directory: native/sandbox-spawner
      run: cargo fmt --all --check
    - name: clippy
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: native/sandbox-spawner
      run: cargo clippy --locked --workspace --all-targets --features test-hooks -- -D warnings
    # 出貨的形狀：不帶 test-hooks。
    - name: 編譯
      shell: bash
      working-directory: native/sandbox-spawner
      run: cargo build --release --locked --workspace --target "$SPAWNER_TARGET"
    # 兩輪：musl 那輪對著出貨的 libc 驗；不帶 target 那輪的 probe 是 glibc 程式，它的 `thread` 驗 glibc（2.34 起先試
    # clone3）拿到 ENOSYS 會退回 clone，工具子行程就是主機上這類 glibc 程式。
    - name: 測試（musl）
      shell: bash
      working-directory: native/sandbox-spawner
      env:
        NEXUS_REQUIRE_LANDLOCK: '1'
      run: cargo test --locked --workspace --features test-hooks --target "$SPAWNER_TARGET"
    - name: 測試（glibc 的子行程）
      shell: bash
      working-directory: native/sandbox-spawner
      env:
        NEXUS_REQUIRE_LANDLOCK: '1'
      run: cargo test --locked --workspace --features test-hooks
    - name: 打 bundle
      if: inputs.bundle != ''
      shell: bash
      working-directory: native/sandbox-spawner
      run: |
        ./bundle.sh "$RUNNER_TEMP/spawner-bundle"
        tar -cf "$RUNNER_TEMP/spawner-bundle.tar" -C "$RUNNER_TEMP/spawner-bundle" .
    - if: inputs.bundle != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.bundle }}
        path: ${{ runner.temp }}/spawner-bundle.tar
        if-no-files-found: error
        retention-days: 7
    - name: 包監督行程與宿主
      if: inputs.per-thread-binaries != ''
      shell: bash
      working-directory: native/sandbox-spawner/target/${{ env.SPAWNER_TARGET }}/release
      run: tar -cf "$RUNNER_TEMP/per-thread-binaries.tar" nexus-supervisor nexus-host
    - if: inputs.per-thread-binaries != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.per-thread-binaries }}
        path: ${{ runner.temp }}/per-thread-binaries.tar
        if-no-files-found: error
        retention-days: 7
