name: 準備 Node 與相依套件
description: 每個要跑 TypeScript 檢查的 job 共用的前置：Node、pnpm、frozen lockfile 安裝。

inputs:
  node-version:
    description: >-
      Node 版本。預設是主版本 24，照 dsh `ci.yml:9` 的 `PRIMARY_NODE_VERSION: '24'`（#1546 Q1 (a)）。
      相容矩陣與下限冒煙才傳別的版本。
    required: false
    default: '24'
  save-cache:
    description: >-
      node_modules 沒有命中快取時，裝好之後存一份。只給合併後完整一輪的一個 job 開：同一把鍵只存得進一次，
      PR 上存的別的 PR 讀不到，上傳又排在關鍵路徑上。
    required: false
    default: 'false'

# node_modules 有兩條路。命中快取：直接用快取裡的 node_modules 與 pnpm。沒命中：pnpm/action-setup 裝 pnpm，
# setup-node 還原 pnpm store，再從 store 裝。
# 兩條路都跑 `pnpm install --frozen-lockfile`：命中時它比對 lockfile 與 node_modules 裡記下的狀態，一致就直接結束，
# 不一致就照 lockfile 重裝。
# 命中時另帶 `--ignore-scripts`，不跑 vendor 的 `prepare`：它產生的宣告檔（vendor/*/lib/types）跟著快取還原。
# 相依的建置腳本（allowBuilds 放行的 esbuild postinstall）在 node_modules 已齊時本來就不重跑，產物也在快取裡。
runs:
  using: composite
  steps:
    # 鍵只帶 `key`、不帶 `restore-keys`：只接受完全命中，部分命中的 node_modules 會帶進別的相依。
    # 鍵含 OS、架構、傳進來的 Node 版本，以及決定 node_modules 內容的檔：lockfile、workspace 設定、.npmrc、各套件的 package.json
    # （bin 的連結、packageManager 指定的 pnpm 版本）。Node 用傳進來的版本而不是 runner 解析出的確切版本：
    # runner 映像混著同一個主版本的不同修補版，確切版本會把同一份快取拆成好幾份；原生模組的 ABI 在主版本內不變。
    # vendor 的宣告檔由 `prepare`（`tsc -p tsconfig.json`）從 vendor/*/src 產生，所以鍵另含 vendor 的 src 與 tsconfig：
    # 改了 vendor 原始碼就不命中，照跑 `prepare`，它同時是 vendor 原始碼的型別檢查（vendor/README.md）。
    # ~/setup-pnpm 是 pnpm/action-setup 預設的安裝位置。型別檢查的快取也在 node_modules 底下，由 ci.yml 另外存取，這裡排除。
    - uses: actions/cache/restore@v6
      id: modules
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
          vendor/*/node_modules
          vendor/*/lib/types
          !packages/*/node_modules/.cache
          !apps/*/node_modules/.cache
          ~/setup-pnpm
        key: node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'vendor/*/package.json', 'vendor/*/tsconfig.json', 'vendor/*/src/**') }}

    # 路徑要跟 pnpm/action-setup 沒命中時設的一致：pnpm 執行檔在 $PNPM_HOME 底下，store 也在那裡。
    - name: 接上快取裡的 pnpm
      if: steps.modules.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "PNPM_HOME=$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
        echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

    # action 一律 pin 浮動 major tag，跟著修補版走；版本下限由 runtime 決定：node20 已棄用，
    # runner 現在強制墊到 node24 並發警告，所以這幾顆都必須是 node24 的 major
    # （checkout ≥ v5、setup-node ≥ v5、pnpm ≥ v5、cache ≥ v5）。
    # 需要 package.json 內含 packageManager 欄位（例如 "pnpm@10.x"）。
    - uses: pnpm/action-setup@v6
      if: steps.modules.outputs.cache-hit != 'true'

    # `cache: pnpm` 會呼叫 pnpm，所以排在 pnpm/action-setup 之後；只在沒命中時開：命中時 node_modules 已齊，用不到 setup-node 還原的 store。
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'pnpm' || '' }}

    - name: 安裝相依套件
      shell: bash
      run: pnpm install --frozen-lockfile ${{ steps.modules.outputs.cache-hit == 'true' && '--ignore-scripts' || '' }}

    - uses: actions/cache/save@v6
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true'
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
          vendor/*/node_modules
          vendor/*/lib/types
          !packages/*/node_modules/.cache
          !apps/*/node_modules/.cache
          ~/setup-pnpm
        key: ${{ steps.modules.outputs.cache-primary-key }}
