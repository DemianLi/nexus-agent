name: 準備 Node 與相依套件
description: 每個要跑 TypeScript 檢查的 job 共用的前置：pnpm、Node、frozen lockfile 安裝。

inputs:
  node-version:
    description: >-
      Node 版本。預設是主版本 24，照 dsh `ci.yml:9` 的 `PRIMARY_NODE_VERSION: '24'`（#1546 Q1 (a)）。
      相容矩陣與下限冒煙才傳別的版本。
    required: false
    default: '24'

runs:
  using: composite
  steps:
    # 需要 package.json 內含 packageManager 欄位（例如 "pnpm@10.x"）。
    # action 一律 pin 浮動 major tag，跟著修補版走；版本下限由 runtime 決定：node20 已棄用，
    # runner 現在強制墊到 node24 並發警告，所以這幾顆都必須是 node24 的 major
    # （checkout ≥ v5、setup-node ≥ v5、pnpm ≥ v5）。
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: '24' # 探針 P2（不合併）：不接 input
        cache: pnpm

    - name: 安裝相依套件
      shell: bash
      run: pnpm install --frozen-lockfile
