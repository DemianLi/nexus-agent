<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nexus-agent</title>
    <!--
      首屏不閃（.docs/web-ui-spec.md §6）：在第一次繪製前套好亮暗。沒有 SSR、harness 不送 HTML，只有這裡來得及。
      跟 src/lib/theme.ts 的 applyTheme 是同一份規則的兩份；key 與三態結果由 src/lib/theme.test.ts 對齊。
    -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem('nexus.theme.preference');
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
