# 出貨的預設 plugin 清單。
#
# 這份檔案是「零設定的 nexus 由什麼組成」的來源（#454）；例外只剩組裝點在程式碼裡掛的一顆：
# host-services（它交的是協作者，不是功能），它不在清單上。**serve 另有一個專屬的出貨層** `cordis.serve.yml`（#669），疊在這份之後、
# 只有 serve 載，放 serve 才有的列（今天只有 workspace-changes）；CLI 的 `--dump-config` 印不到它。使用者要改的話不是編輯它，
# 而是在 `$NEXUS_AGENT_HOME/cordis.patch.yml`（預設 `~/.nexus-agent/`）或 `--patch <檔>`
# 裡按 `id` 覆寫、停用、插入——patch 是整份替換 `config`，不是深層合併，所以覆寫的時候要
# 把想保留的欄位一起重述。
#
# 每一列的欄位：
#
#   id        這一次掛載的識別。外面的 patch 靠它指到這一列，所以名字是承重的。
#   name      模組 specifier，用動態 import 載進來再取 default export。
#   config    交給那顆 plugin 的設定，由它自己的 `Config` schema 驗。驗不過（或 `apply` 裡才驗的
#             值不合法）的那一列掉了、啟動時印一段警告，其餘照樣起來；只有 `browser-session`
#             （必掛）掉了會整個起不來（#751，照 dsh 分必掛與可少掛）。沒有 `Config` 的 plugin
#             （下面八個配套入口全部是）沒有設定：寫了也沒有作用，照樣掛，啟動時印警告。
#   disabled  這一次掛載不跑。只收字面布林——dsh 那邊可以寫 `!!js` 運算式，我們刻意不接
#             （#104 的偏離標註）。
#
# 疊完之後這台機器上實際長什麼樣，用 `--dump-config` 看（cli 與 serve 都收）：它印出啟動
# 會掛的那份清單（上面由程式碼掛的那一顆不在內；serve 的包含 `cordis.serve.yml` 那一層），每一段前面標明那幾列來自哪個檔、被哪幾層改過；指到不存在 id 的 patch
# 會連同它那一層的標籤報到 stderr。用法見 docs/operations.md 的「plugin 清單」一節。
#
# 要事先知道某一列收哪些欄位（寫覆寫檔用），用 `--dump-config-schema`：印出一份 JSON Schema，
# 用法見 docs/operations.md 的「寫覆寫檔之前先看欄位規格表」。
#
# 順序不承載語意，分組是給人看的。兩件事今天靠組裝的現況成立、沒有機制擋，各有絆索：
#
#   服務相依  清單上的列在 `apply` 當下讀的服務都由組裝點的 host-services 提供（它排在整份清單
#             前面），沒有一列讀另一列提供的服務。守它的是 `src/shipped-service-reads.test.ts`。
#   核准閘門  waterfall 的順序就是載入順序，今天只靠清單裡一位 gate 都沒有。守它的是
#             `src/approval-gate-order.test.ts`。

# ── 功能 ──────────────────────────────────────────────────────────────────────
#
# **工具只有 echo 一個。** 預設組裝要能證明「工具真的接上了」，而不是替誰決定該裝什麼。
# 哪些工具 plugin 該進出貨清單是設定的事——這份檔案就是那件事有地方講之後的樣子（#46）。
#
# 下面四個是講得出理由的例外，每一個的代價都寫在它自己那一列上。

- id: echo
  name: '@nexus/plugin-echo'

# 工作區指令（#388）：產品路徑上的 CLI 與 serve 也看得到 `AGENTS.md`。有 backend
# 才會真的建 middleware，所以沒給 `--workspace` 時它什麼都不加——與 dsh「沒有檔案系統
# 提供方就載不到」同形。
- id: agent-instructions
  name: '@nexus/plugin-agent-instructions'

# 技能（#440）：工作區的 `skills/<name>/SKILL.md` 讓模型看得到、需要時自己去讀。來源預設
# 是 backend 命名空間下的 `/skills/`，要加別的目錄在 `sources` 列出（依序即優先序）。
#
# **沒有 skill 就一個字都不加**（照 dsh：目錄訊息清單為空且從沒發佈過就不出現，
# `packages/skill/tool-skill/src/index.ts:237`）：沒給 `--workspace`、或工作區沒有 `skills/`，
# 送給模型的 system prompt 與沒掛這一列逐位元組相同，空結果也只掃一次。基座的 skills
# middleware 做不到這一點（對空清單照樣接約 2000 字、又每一輪重掃），所以組裝點包了一層，
# 偏離登記在 `packages/nexus-core/src/skills-middleware.ts` 檔頭。
- id: skills
  name: '@nexus/plugin-skills'

# **例外一：計劃模式**（#120）。它註冊的是一個**人打得到的命令**，而命令沒進出貨清單就
# 等於不存在——`/plan` 會被 `parseCommand` 判成「名字不認得」，照原樣掉回模型，變成一行
# 沒人懂的純文字。「不替誰決定該裝什麼」在這裡撞上「那就誰也用不到」，後者比較貴。
#
# 代價三筆：
#
# - `startActive` 是關的，所以不打 `/plan` 的話指引一個 token 都不夾。
# - `exit_plan_mode` 一律出現在面向模型的工具清單裡（照 dsh：模式轉換不該額外造成工具
#   目錄變動）。CLI 上它是活的 schema、死的執行路徑——模式外撞 middleware、模式內撞
#   `HEADLESS_APPROVALS` 的確定性拒絕。
# - **serve 也吃這份清單**，而那條路上有命令介面（#123）：web 那端自己打 `/plan` 就進得
#   去，而且核准是開著的，所以「規劃 → 交計劃 → 有人按批准 → 開始動手」整條走得完——那
#   是 CLI 這條路走不完的。
- id: plan-mode
  name: '@nexus/plugin-plan-mode'

# **例外二：goal**（#126）。同一條理由：命令沒進清單，`/goal 把測試修綠` 會掉回模型變成
# 一句閒聊。代價兩筆：每一次執行多接一位會話參與者，以及模型側多三顆工具
# （`create_goal`／`get_goal`／`update_goal`，#177 之後才有的東西，一律 `rootOnly`，所以
# subagent 那幾份看到的是拒絕樁）。它不改 prompt、不碰 backend，沒有目標時連一顆事件都
# 不寫；但工具清單與那幾顆的 token 確實變了。
#
# **域與命令是同一個 plugin**，不像 dsh 拆成兩個套件——理由寫在 `@nexus/plugin-goal` 的
# 檔頭上。
- id: goal
  name: '@nexus/plugin-goal'

# **例外三：todo**（#132），代價是四者裡最重的：它**真的多一顆面向模型的工具**
# （`todo_write`），所以每一次請求都多一份 schema 與描述的 token，不打任何命令也一樣。
#
# 它進得來的理由不是「順便」，是**它沒有別的入口**：todo 是模型自己的規劃工具，人不打
# 它、命令也叫不動它，所以「沒進清單就等於不存在」對它比對前兩個更絕對。dsh 對「先想再
# 做」的答案是計劃模式 ＋ todo ＋ goal 三件一組，這是第三件。
#
# `allowParallelInProgress`：這棵樹的 subagent 是真的併發跑的（`tool-session-log.test.ts`
# 那條同一個 subagent 併發兩次的驗收），而 dsh 對這種部署開的就是 true。這個開關沒有預設
# 值，理由見 `TodoPluginOptions`。
- id: todo
  name: '@nexus/plugin-todo'
  config:
    allowParallelInProgress: true

# 評分與 `/feedback`：預設就裝，零設定的 serve 與 CLI 都評得到（#278）。
#
# `maxNoteBytes` 是一則評分備註最多幾個 UTF-8 位元組。照 dsh web 那一包的設定
# （`packages/bundle/web-app/cordis.patch.yml:56`，`c291e79`）；plugin 自己不給預設值，
# 所以這一行是整棵樹上唯一講這個數字的地方。
- id: feedback
  name: '@nexus/plugin-feedback'
  config:
    maxNoteBytes: 8192

# **例外四：交付宣告**（#441）。dsh 的 standard preset 掛 `tool-present`，而 web 的交付
# 卡片讀的事件只有它寫得出來。代價同 todo，多一顆面向模型的工具（`present`）；沒有工作區
# 時工具照樣在、叫了被拒，同 dsh。
- id: present
  name: '@nexus/plugin-present'

# **例外五：提問與提交紀錄**（#669）。這兩顆以前由 `createCliAgent` 在程式碼裡掛，patch 指不到、`--dump-config` 印不出來；
# 部署方想在多人共用的主機上關掉 `ask_user_question`，寫 `- id: ask-user` ＋ `disabled: true` 只會得到一行「找不到 id」。
# 搬進清單之後它們跟其他列一樣：看得見、關得掉。dsh 的 ask-user 也只是 preset 裡的一列。
#
# 兩顆都沒有資料設定，協作者走服務注入（#459）：`ask_user_question` 讀 host-services 提供的答題管道（**沒有就在呼叫時拒絕**，
# 不退成「有人在」，照 dsh 的 `NO_PROVIDER`），`submit_record` 在被叫時讀 `fs` 服務（#694，折出來的 backend）。host-services 仍由組裝點在最前面掛。
# 我們的 CLI 是有人在的互動入口，dsh 沒有對應物，所以兩個入口照舊都有這兩顆。
#
# `submit_record` 帶一道核准閘門（一律停下來讓人看過），所以它在 `approval-gate-order.test.ts` 的射程內。
- id: ask-user
  name: '@nexus/plugin-ask-user'

- id: submit-record
  name: '@nexus/plugin-submit-record'

# **例外六：軌跡投影**（#1027，地圖 #1015）。把 root 日誌一輪一組折成「每次模型呼叫發生了什麼」——起訖、用量、重試、回覆、工具、決策點——
# 與每次呼叫實際送出的系統提示詞和請求設定，經 #1026 的投影通道送到 web 的觀測分頁。
#
# 代價：**不多工具、不改 prompt、不碰 backend、不寫日誌**，模型那一側零差別。要付的是兩筆：每顆事件多一次純函式折疊（量到
# 每顆約 1 微秒），以及投影有變時多送一顆 `projection` frame。**frame 是整份取代、每顆讓投影改變的事件都重送**，所以下行量 ≈
# 事件數 × view 大小。view 有上限（最近 8 輪完整、更早只留摘要列；一輪最多留 32 次呼叫、一次呼叫最多 16 個工具），量到的大小：
# 典型的 8 輪（每輪 3 次呼叫、2 個工具）一顆約 15 KB、整段下行約 1.6 MB；預設迴圈上限下 8 個滿載輪（33 次呼叫 × 10 個工具）一顆最大約
# 377 KB、整段下行約 1.2 GB；理論最壞一顆約 0.6 MB；長會話另加最多 200 列摘要（約 50 KB）。請求快照那顆只在快照真的變了才重送。沒有設定可調。
#
# 關掉它（`disabled: true`）的結果：web 的觀測分頁讀不到這兩份投影，其餘一切照舊。沒有它，通道仍然在，只是沒有單元。
- id: trajectory
  name: '@nexus/plugin-trajectory'

# **例外七：用量投影**（#1028，地圖 #1015）。把會話日誌折成逐輪、逐會話的用量——步數、工具次數（依名）、輸入／輸出 token
# （成功＋失敗，生摘要那一次另列）、三段時間（模型扣掉重試退避、工具、停在核准點的等待）、每一輪怎麼結束——root 與每個子代理
# （前景、背景都算）各折一份，經 #1026 的投影通道送到 web 的觀測分頁。**不另造總帳**：root 的 `tokenUsage`、`sessionStats` 照舊，
# 這個投影在它們之上補逐輪與子代理，由測試釘住兩邊對得上。
#
# 代價：**不多工具、不改 prompt、不碰 backend、不寫日誌**，模型那一側零差別。要付的是：每顆事件多一次純函式折疊，與投影有變時
# 多送一顆 `projection` frame（**整份取代、每顆讓投影改變的事件都重送**，所以下行量 ≈ 事件數 × view 大小）。view 有上限
# （最近 20 輪帶逐輪的列、更早併成一列；依工具名 12 個、依模型 6 個、子代理連結 64 筆，超過的併進 other）。**宣告了
# `children: true`**，所以每個子代理多一份折疊、多一條 frame 流，歷史最新一頁每個子代理多一顆 frame。
# 量到的大小（合成日誌，2026-10-05）：root 窗口滿（30 輪，每輪 3 次呼叫、4 個工具）一顆約 18 KB，30 輪 × 8 呼叫 × 10 工具約 23 KB；
# 一個子代理（6 次呼叫、4 個工具）約 2.1 KB；30 輪的整段下行約 7.3 MB（601 顆 frame）。100 個子代理讓歷史最新一頁多約 221 KB
# （頁面位元組上限 8 MB 是軟的、不含投影 frame）。沒有設定可調。
#
# 關掉它（`disabled: true`）的結果：web 的觀測分頁讀不到用量投影，其餘一切照舊。
- id: token-meter
  name: '@nexus/plugin-token-meter'

# 系統提示詞的身分與 persona（#720）。照 dsh 的 `system-prompt`（`packages/core/system-prompt/src/index.ts:407-442`）
# 三格設定；出貨值對應 dsh 四個入口 profile 覆寫成的那一組（`packages/bundle/web-app/cordis.patch.yml:16-20`），
# 英文，開頭句不自稱寫程式。順序是身分句 → 前綴 → 其餘（含組裝點傳的那句指引）→ 後綴，**後綴永遠是最後一段**。
#
# - `includeHarnessIdentity`：最前面一句 "You are an AI agent powered by nexus-agent."。
# - `personaPrefix`／`personaSuffix`：`{{model}}`（這一次組裝的模型 id）與 `{{cwd}}` 可以引用。**嚴格插值**：
#   未知的變數、沒有值的變數、寫壞的 `{{…}}` 都讓啟動失敗，訊息指名是哪一格與哪個變數。
#   **`{{cwd}}` 是檔案工具的位址空間裡的根（`/`），不是主機路徑**：工具收不下主機路徑（登記在
#   `@nexus/plugin-system-prompt` 的檔頭）。
#
# **patch 是整份取代 `config`**：只寫 `includeHarnessIdentity: false` 的話，前後綴也回到空。所以這一列三格全部寫出來。
# 這一列掉了（設定寫壞）整個起不來（`startup-audit.ts` 的必掛名單）：靜靜少了身分與 persona，比大聲失敗更糟。
# 子代理也帶部署 persona（它們的請求走同一顆 middleware）。
- id: system-prompt
  name: '@nexus/plugin-system-prompt'
  config:
    includeHarnessIdentity: true
    personaPrefix: 'You are a helpful assistant powered by the {{model}} model.'
    personaSuffix: 'Your working directory is {{cwd}}.'

# ── core 的設定 ──────────────────────────────────────────────────────────────
#
# 這幾列**不裝功能，只講設定**（最後一列 `session-persistence` 例外：它代表落盤本身，#612）。
# **它們內部分兩層，分界同 harness 那一段——消費點跑的時刻**：
# 前七列（到 `approval-gate` 為止）是**組裝期**（#456），消費者是 `foldRegistry`，註冊表就在
# 手上；最後一列 `session-persistence` 是**起動期**（#529），而且它代表落盤本身、關得掉（#612），
# 理由寫在它自己那一段上。
#
# 組裝期那七列：middleware 本身由 `foldRegistry` 建與排位——位置
# 是承重的（有四條測試釘著）、而且有一顆必須逐個 agent 各建一份，這兩件事
# `registry.middleware.use()` 都表達不出來。所以帶設定的條目，`apply` 只做一件事：把驗過的
# 設定提供成一個服務，fold 從那裡讀；**沒有設定的那一顆連服務都不註冊**（照 dsh 的
# `fs-observation-policy`），它在場的唯一意義是「關得掉」。偏離登記在 `@nexus/core` 對應那
# 個檔的檔頭上。
#
# **關掉它就是 `disabled: true`**，語意照 dsh：條目不掛，那一顆 middleware 真的不在 stack
# 裡。要改設定就在 patch 檔裡重寫這一列的 `config`——整份替換，沒重述的欄位回到預設值。
#
# **組裝期那七列的最後一列是例外，而且是明著的例外**：核准閘門關不掉，`disabled: true` 在
# 載入期當場拋。理由寫在它自己那一段上。

# 連續重複同參數呼叫同一個工具時提醒模型（#147）。門檻與參數預覽字數照 dsh base 的
# `repeat-tool-reminder`（`packages/bundle/base/cordis.patch.yml:441`，`ddefc45`）；
# `include`／`exclude` 是我們多的兩格，空陣列＝追蹤全部工具。
#
# **這一列寫出全部四格是刻意的**：patch 是整份替換 `config`，所以照著改的人手上要有完整
# 的一份可以抄；而預設值本身寫在 plugin 的 schema 裡，不是寫在這裡。
- id: repeat-reminder
  name: '@nexus/core/repeat-reminder'
  config:
    thresholds: [3, 5, 8]
    include: []
    exclude: []
    argumentsPreviewChars: 500

# 摘要之前先把過長的工具結果剪掉中段（#446）。三格預算照 dsh base 的 `tool-result-pruner`
# （`packages/bundle/base/cordis.patch.yml:404`，`ddefc45`）。
#
# **只在摘要開著時有作用**：dsh 的 pruner 唯一的消費者是 compaction，摘要不掛就沒人叫它。
# 但設定照樣在載入期驗——寫錯不會因為今天剛好沒用到就放過。
- id: tool-result-pruner
  name: '@nexus/core/tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# 壓力達標時把舊訊息摘要成一則，歷史 offload 到 backend（#143）。四格**全部寫出來**，理由
# 同上面兩列：patch 是整份替換 `config`。這幾個數字的來歷（尤其 `tokens: 100000` 為什麼是
# 這個值、以及換模型要重量一次）寫在 `DEFAULT_SUMMARIZATION` 的檔頭上，不在這裡重述。
#
# **關掉它（`disabled: true`）發的是一顆同名空殼，不是「沒有」**：基座無條件建一顆摘要器，
# 同名取代是唯一消得掉它的辦法。連帶沒有的還有歷史 offload 與上面那把剪刀。
- id: summarization
  name: '@nexus/core/summarization'
  config:
    trigger:
      - { type: tokens, value: 100000 }
      - { type: messages, value: 60 }
    keep: { type: messages, value: 20 }
    truncateArgs:
      trigger: { type: messages, value: 20 }
      keep: { type: messages, value: 20 }
    historyPathPrefix: /conversation_history

# 先讀後改：沒讀過的檔不准改（#273）。照 dsh base 的 `fs-observation-policy`
# （`packages/bundle/base/cordis.patch.yml:264`，`ddefc45`）預設就載著。
#
# **這一列刻意沒有 `config:`**：這一顆沒有設定，plugin 也就沒有 Config schema，寫了也沒有
# 作用——照 dsh 原樣交下去、不驗，那一列照樣掛（先讀後改照樣在），啟動時印警告（#751）。它跟上面兩列
# 因此差一格——上面兩列是四態（明著傳的 > 條目的設定 > 被關掉 > 內建預設），這一列只有
# 三態，因為「條目在場」與「沒有經過設定檔」的答案都是「開著」。
#
# 關掉它等於**這個組裝接受盲改**，不是省一點開銷。
- id: observation-policy
  name: '@nexus/core/observation-policy'

# 每一次模型呼叫的 token 帳目記進會話日誌（#264）。**這一列刻意沒有 `config:`**，理由同上
# 一列：這一顆沒有任何數字可以調，plugin 也就沒有 Config schema，寫了也沒有作用、啟動時印警告。
# 所以它跟上面那一列一樣是三態。
#
# **關掉它之後不見的是落盤日誌裡那本逐次呼叫的 token 帳**（`model/usage`），連帶 web 用量表
# 的「目前大小」那一行（#528，它讀 root 最新那一筆；環與比例讀的是摘要器的量測，照舊在）。
# 加總它的仍然沒有——評估那條路的數字是它自己從 `usage_metadata` 加的，跟這一顆無關。
- id: model-usage
  name: '@nexus/core/model-usage'

# 一輪之中的耐久檢查點（#599）：模型請求之前、工具動手之前（root 與子代理都是），先把那次呼叫所屬的會話日誌
# 排空到耐久。照 dsh base 的 `session-checkpoint-policy`（`packages/bundle/base/cordis.patch.yml:412`，
# `477b4f4`）。**這一列同樣沒有 `config:`**，理由同上兩列。
#
# **關掉它之後**，日誌只在批次窗口到期與收尾時落地：正常收尾照樣完整，但收尾被打斷（收尾中
# 再按一次 Ctrl-C、`kill -9`、當機）時丟的可能是整輪，而不只是最後一步的尾巴。沒接落盤的
# 組裝上它什麼都不做（CLI 與 serve 從 #444 起一律落盤，只剩手搭的組裝沒接）。
- id: session-checkpoint-policy
  name: '@nexus/core/session-checkpoint-policy'

# 核准閘門（#111）。**這一列關不掉**：寫 `disabled: true` 會在載入期當場拋，`--dump-config`
# 也一樣擋——檢查住在 `validateEntries` 裡，兩條路共用它。
#
# 它跟上面六列都不同型：上面六列的 `disabled` 是真的會讓那一顆不在 stack 裡，這一列的
# `disabled` 是一個錯誤。閘門由 `foldRegistry` 無條件建，今天沒有任何設定關得掉它，
# 而這一列不存在的時候 `- id: approval-gate` ＋ `disabled: true` 只會警告一行然後跳過
# ——讀起來像成功關掉了，實際上核准照樣在問。量過（2026-09-22）：exit 0、stderr 一行、
# dump 與沒帶那份 patch 逐字相同。
#
# 第二個理由跟擋人無關：**這一列讓核准在 `--dump-config` 裡看得見**。沒有它的時候，那份
# dump 從頭到尾沒有任何一列跟核准有關，想確認「這台機器上核准是開的嗎」的人分不出來。
#
# `config:` 同上：沒有設定，寫了也沒有作用，啟動時印警告。
- id: approval-gate
  name: '@nexus/core/approval-gate'

# **會話日誌落盤本身**，以及它的批次窗口（毫秒，#457／#529）。**這一列代表落盤**（#612），照 dsh
# base 的 `session-persistence-jsonl`（`packages/bundle/base/cordis.patch.yml:130-133`，`477b4f4`）：
# 掛著就寫（CLI 與 serve 都寫，預設在 `$NEXUS_AGENT_HOME/sessions`，#444），**`disabled: true` 就是
# 一個位元組都不寫**——兩個入口只在記憶體裡、啟動時照實講，serve 的 thread 列表回「列不出來」，
# 而 `--resume` 與 `--session-log` 跟它矛盾，給了就當場拋（照 dsh：headless 的 `--session-id`
# 沒有持久化服務就拋）。寫去哪裡不歸這一列管，歸 `--session-log`／`NEXUS_AGENT_HOME`。
#
# **這一列跟上面七列不同層**：上面七列的消費者是 `foldRegistry`（組裝期，註冊表在手上），這一列的
# 消費者是 `cli.ts` 與 `serve.ts` 起動期的那幾行——跑在 `createCliAgent` 之前（開不開、寫去哪都要在
# 建 agent 之前定），而那個函式一格註冊表都沒有回傳。更硬的理由是壽命：窗口講的是那一顆
# `SessionStore` 的寫入節奏，而 store 在 serve 上是**整台伺服器一份**、註冊表是**一條 thread 一份**。
# 所以這一列的 `apply` 是空的，值由 `startupSetting` 在起動期解一次往下傳、開關由
# `startupEntryMounted` 問，同下面 harness 那幾列的機制。
#
# **窗口是 dsh 沒有的旋鈕**：它的 `session-persistence-jsonl` 只收 `root` 與 `compression`
# （`packages/session/session-persistence-jsonl/src/index.ts:236-239`，`ddefc45`），因為 dsh 的
# 批次是呼叫端傳一整批，不是計時器攢批。這不是「表達不出來」的偏離，是標準沒有這個旋鈕。
#
# **0 是合法值**，意思是不批次、每一顆事件各寫一次；上限是 `setTimeout` 收得住的
# 2 147 483 647，超過它的值會讓計時器**立刻**觸發（等於窗口消失），所以擋在 schema 上。
- id: session-persistence
  name: '@nexus/core/session-persistence'
  config:
    windowMs: 10

# ── harness 自己的設定 ────────────────────────────────────────────────────────
#
# 這幾列跟上面那段 core 的 middleware 設定同一個用途——**不裝功能，只講設定**——但擁有者住在
# `apps/harness`（[#529](https://github.com/DemianLi/nexus-agent/issues/529)）。
#
# **它們內部又分兩層，分界是消費點跑的時刻**：
#
# - **起動期**（`thread-title`、`thread-title-llm`、`thread-search`、`browser-session`、`deliverable-files`、`tool-text`、`projection-flush`、
#   `tool-result-stash`、`spill-policy`、`background-subagents`、`subagent-model-selection`、`live-model`）：消費者是`serve.ts` 的冷讀清單、內容搜尋的索引、`BrowserAuth` 的建構子、`createWireHandler` 閉包裡的
#   兩條交付路由，以及交給組裝的那顆 model——全都在**任何 agent 出生之前**就要有值，那一刻註冊表還不存在。`thread-title`
#   另外還給寫退回標題的 pump 與 CLI（#647），吃的是同一份起動期的值；`thread-title-llm` 跟它一起在建模型的那一刻
#   讀（#650）。所以這幾列的 `apply` 是空的，值由
#   `src/settings/startup.ts` 的 `startupSetting` 在起動期解一次、往下傳一份——形狀上仍是
#   「值從一個地方來」，機制上不是服務，那條退讓登記在 #529 上。
# - **組裝期**（`recursion-limit`、`agent-loop`、`tool-fs-search`）：消費者是 `agent-factory.ts`，跑在 `loadPlugins` 之後，
#   **註冊表就在手上**。所以這一列跟上面 core 那三列完全同形——`apply` 把驗過的值提供成一個
#   服務，消費點去讀服務。這一層做得到的事，不該跟著上一層退。
#
# **`name` 是 `#settings/…` 而不是一個套件名**，那是一條登記過的偏離，八列共用：dsh 的每個可調值
# 都由一個套件擁有，而 `apps/harness` **解不到自己**（條目走 `import(entry.name)`，`@nexus/harness`
# 沒有連進自己的 `node_modules`，實測是 `Cannot find package`）。退到 Node 的 `imports` 欄位，映射
# 寫在 `apps/harness/package.json` 裡看得見。逐條理由在 `src/settings/thread-title.ts` 的檔頭。
#
# **除了 `thread-title-llm` 與 `thread-search`，這六列關不掉**（`plugin-config.ts` 的 `PROTECTED_ENTRY_NAMES`），但理由分兩種。
# 起動期那五列是
# 「關掉沒有意義」：它們不裝任何東西，關掉不會讓標題不再被裁切、cookie 不再過期、交付檔不再有
# 上限——`startupSetting` 把關掉的那一列當成沒有那一列，於是回到 schema 的預設值。
# `recursion-limit` 硬一級——關掉它在機制上確實會讓服務消失、於是落回內建的 100，**看起來像關掉了
# 護欄，實際上護欄還在**。兩種都只會讓人以為自己關掉了什麼。`thread-title-llm` 與 `thread-search` 相反：關掉
# 它們就真的沒有模型產生的標題、沒有內容搜尋，理由寫在各自那一段上。

# 會話標題的兩個上限（#302、#647）：列表、畫面標頭與日誌裡的退回標題都照它截。值照 dsh base 的 `session-title`
# （`packages/bundle/base/cordis.patch.yml:55-60`，`ddefc45`：`fallbackMaxWords: 5`、
# `fallbackMaxBytes: 40`），**數字一模一樣**。
#
# 兩格全部寫出來，理由同上面那三列：patch 是整份替換 `config`，照著改的人手上要有完整的一份
# 可以抄；預設值本身寫在 schema 裡，不是寫在這裡。40 個位元組是 13 個中文字——中文沒有空白，
# 詞數那一格咬不到。
- id: thread-title
  name: '#settings/thread-title'
  config:
    maxWords: 5
    maxBytes: 40
    maxTitleBytes: 80

# 模型產生的會話標題（#650），只在 `--live` 時才跑：第一則人話開跑、主回覆的第一次模型呼叫送出之後，另外打一次
# 標題模型，回來的標題蓋過上面那一列截出來的退回標題。照 dsh base 的 `session-title-llm`（掛的是
# `@deepseek-ai/dsh-session-title-first-prompt-llm`，`packages/bundle/base/cordis.patch.yml:62-69`，`477b4f4`），
# **五個數字一模一樣**。上面那一列的 `maxTitleBytes` 是任何來源的標題上限，模型產生的照它正規化。
#
# **這一列關得掉**，跟上面那一列相反：`disabled: true` 就是只剩退回標題，同 dsh 的 acp-app 與 sdk-app。
# 標題走 `live-model` 那一列的連線；模型預設沿用它的預設模型，選配的 `modelId`（#657）可以改挑那一列 `models` 型錄裡的
# 另一筆，關推理的寫法跟著那一筆走（dsh 那一對成對的 `provider`／`model` 我們只有 `modelId`，理由見
# `src/settings/thread-title-llm.ts` 的檔頭）。**不寫就是沿用**，不要寫成預設模型的 id——那樣換了預設模型標題不會跟著換。
- id: thread-title-llm
  name: '#settings/thread-title-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000

# 按內容搜尋以前的會話（#631），側欄的搜尋框用它。**出廠不開**（`openAt: never`），同 dsh `base` 與 `web-app` 兩個
# bundle 的 `session-query-sqlite` 那一列（`packages/bundle/base/cordis.patch.yml:141-153`、
# `packages/bundle/web-app/cordis.patch.yml:22-30`，`477b4f4`）：要不要多背一份索引是部署自己的選擇。不開的時候側欄
# 只比標題，同今天。要用的人在自己的 `~/.nexus-agent/cordis.patch.yml` 把這一列改成 `openAt: first-search`（第一次搜才
# 載入）或 `startup`（serve 起動就載入），寫法見 docs/operations.md。
#
# **這一列關得掉，而且關掉跟 `never` 不一樣**：`disabled: true` 是沒掛，搜尋一律回失敗；`never` 是掛了不開，沒有
# 會話可搜時照樣回空。**schema 的預設是 `startup`**（同 dsh），所以把 `config:` 整段拿掉的 patch 會把它打開。
# 索引只放在記憶體、斷詞與 dsh 不同（中文），理由見 `src/settings/thread-search.ts` 與 `src/thread-search.ts` 的檔頭。
- id: thread-search
  name: '#settings/thread-search'
  config:
    openAt: never

# 瀏覽器 cookie 的絕對有效期（#424）。dsh 那側是 plugin 設定 `cookieMaxAgeDays`，預設同樣是 30
# ——這一列補上的正是 `browser-auth.ts` 原本登記的那條偏離（「寫死 30 天，不能設定」）。
#
# **這一列是必掛的**（#751，`src/startup-audit.ts`）：設定寫壞了不是少掛一列，是整個起不來——CLI 也一樣，
# 兩個入口共用這一份清單。對到 dsh 必掛名單上的 `connection`。
- id: browser-session
  name: '#settings/browser-session'
  config:
    maxAgeDays: 30

# 交付檔的三個上限（#452／#457）。**形狀與數值都沒有偏離**：dsh 的
# `@deepseek-ai/dsh-api-workspace-files` 就是一顆 plugin 三格（`packages/api/workspace-files/
# src/index.ts:185-189`，`ddefc45`），三個預設值逐字相同——2 MiB、32 MiB、5000。欄位名照它。
#
# **`maxLines` 是雙用的**：沒給 `limit` 查詢參數時用它當預設，給了就不准超過它。dsh 一樣
# （`index.ts:371-373` 兩處讀同一個 `this.config.maxLines`）。所以改這一格會同時動到兩個行為。
#
# 三格全部寫出來，理由同上面那幾列：patch 是整份替換 `config`。
- id: deliverable-files
  name: '#settings/deliverable-files'
  config:
    maxBytes: 2097152
    maxFileBytes: 33554432
    maxLines: 5000

# 工具結果的 `meta` 與壓縮摘要全文放上線的位元組上限（#538／#457）。搜尋與改檔的 `meta` 上限就是 `maxBytes`，讀檔是它的
# 兩倍；壓縮標記的摘要全文（#896）超過時取頭尾、中間一句說明。
#
# **工具結果文字不歸這一列管**（#736）：外溢層（#719，下面 `spill-policy` 那一列）落地後日誌記的就是換過的預覽，
# 照 dsh 不再在傳輸上截第二次——文字的上限在模型面，由 `spill-policy` 與讀檔自己的上限決定。名字沒跟著改：
# 改名會讓已經寫了 `tool-text` 的 patch 載入失敗。50000 當初抄的是 dsh 舊版 `spill-policy` 的 `maxInlineBytes`，
# dsh 在 `477b4f4` 已改成 `maxInlineTokens: 12500`，對應的是我們 `spill-policy` 那一列。逐條理由見
# `src/settings/tool-text.ts` 的檔頭。
#
# **改這一格會讓一條跨套件的比例失效，而且沒有任何東西會紅。** `@nexus/wire` 的
# `HISTORY_PAGE_MAX_BYTES = 8_000_000` 是照每張卡「文字加 `meta`」的最壞值算的，`meta` 的那一半跟著這一格走，
# 那個關係由 `apps/harness` 的一條測試釘著；這一列讓它**只在 schema 的預設值底下成立**。那是 #538 三選一裡
# 明著選的第三條（2026-09-23 拍板）。
- id: tool-text
  name: '#settings/tool-text'
  config:
    maxBytes: 50000

# 插件投影 frame 的合併視窗（#1071；2026-10-05 的 #1015 決議做成設定項）：輪中連續變更的投影值，一個單元一個視窗，
# 視窗到了送那一刻最新的整份值。**視窗本身在 dsh 的投影通道上沒有對應物**（`control.ts:22-31` 每次變動就廣播），形狀借自
# job-controller 的 `observeFlushMs`（`z.natural().min(1).default(100)`），所以視窗是偏離、旋鈕抄 dsh：自然數、最小 1、預設 100。
# 只在輪中有效，輪結束與收線一定先送掉待送的，所以調大只讓輪中更新變慢、不影響最終值。對所有插件投影單元共用。
# 起動期讀一次、改值要重啟。**這一列關不掉**，理由同 `tool-text`：關掉會回到預設 100，讀起來卻像把合併關了。
- id: projection-flush
  name: '#settings/projection-flush'
  config:
    flushMs: 100

# 過大的工具結果暫存到主機上的哪裡、留多久（#734）。**兩格名字都是 dsh `spill-local` 的**（`root`、`cleanupPeriodDays`，
# `packages/spill/spill-local/src/index.ts:66-69`，`477b4f4`）。`root` 不寫就是 harness home 底下的 `tool-results`
# （偏離 dsh 的「每行程一個暫存目錄」：基座的路徑是虛擬的，續接時要讀回同一個檔，所以根要固定，理由與登記見
# `src/tool-result-stash.ts`）；`cleanupPeriodDays: 0` 表示不清，啟動時清一次，別人改得動的根不清。
- id: tool-result-stash
  name: '#settings/tool-result-stash'
  config:
    cleanupPeriodDays: 30

# 一則工具結果最多佔多少估算 token（#719）。超過就把全文存進上面那個暫存目錄，模型只收到頭尾預覽加路徑，
# 用 `read_file` 去讀全文。**欄位名與 12500 都是 dsh 的**（`packages/spill/spill-policy/src/index.ts:34`、
# `packages/bundle/base/cordis.patch.yml:409`，`477b4f4`）。**省略 `maxInlineTokens`（或把這一列標成 `disabled: true`）
# 就停用**，照 dsh；停用之後超過 80,000 字元的結果仍由基座換成預覽，那一條關不掉。`read_file` 不外溢。
# 找不到暫存目錄可寫（沒有會話日誌的組裝、目錄不可寫）時保留原結果，不外溢。
- id: spill-policy
  name: '#settings/spill-policy'
  config:
    maxInlineTokens: 12500

# 搜尋結果的筆數上限（#735）：`grep` 命中超過 `grepMaxMatches`、`glob`／`ls` 超過 `globMaxResults` 時，模型只收到前段
# 加一句定位，完整結果存進上面那個暫存目錄，用 `read_file` 照定位讀。**id、兩格的名字與 250／100 都是 dsh 的**
# （`packages/fs/tool-fs-search/src/index.ts:73-100`、`grep.ts:29`、`glob.ts:25`，`477b4f4`）；`ls` 沿用 `globMaxResults`
# （dsh 沒有這顆工具）。`grep` 只管 `content` 模式。暫存目錄寫不進、或沒有會話日誌時，照樣只留前段，結尾註明沒存到。
# **把這一列標成 `disabled: true`（或刪掉）就回到基座原樣**：超過 80,000 字元由工具本體自己截掉，原文不留。
- id: tool-fs-search
  name: '#settings/tool-fs-search'
  config:
    grepMaxMatches: 250
    globMaxResults: 100

# 委派工具是一次性的還是背景續行的（#841），以及每個主對話同時存活的背景子代理上限。**兩格名字與值域都是 dsh 的**
# （`backgroundMode` 是 `tool-subagent` 的 Config、`maxActiveSubagents` 預設 8，`packages/subagent/tool-subagent/src/index.ts:111`，
# `477b4f4`），**出貨值 `continuable` 也是 dsh base bundle 打開的**（`packages/bundle/base/cordis.patch.yml:369-374`）。
# `continuable`：模型看到 `subagent`，派出去預設在背景跑、當場回編號；做完會叫醒主對話多跑一輪。`one-shot`：模型看到基座的 `task`，
# 一次性、等結果。**改成 `one-shot`（或把這一列標成 `disabled: true`）就回到一次性。**
# 上限是**每個主對話各自的**，不是整台主機的：同時在跑的背景子代理到「會話數 × 上限」這個量級。
# **`backgroundMode`、`maxActiveSubagents` 只有 `serve` 讀**：REPL 一行一輪、一次性模式答完就退出，都沒有可以被叫醒的一輪，背景子代理的結果送不回來。
# `toolFilter`（#707，**出廠不填**，同 dsh）：`{ allow?, deny? }` 套在**每個**子代理上（前景的 `task`、背景的 `subagent`、`general-purpose`），root 不受影響；
# `allow` 只留列到的（`allow: []` 是一個都不留）、`deny` 拿掉列到的。只遮繼承來的全域工具與基座檔案工具，子代理自己那層註冊的不遮。
# 兩個入口都讀，與 `backgroundMode` 無關。名字寫錯、或設了卻沒有 allow／deny，**起不來**（這一列是必掛的，寫壞不能退成「沒有過濾」）。
- id: background-subagents
  name: '#settings/background-subagents'
  config:
    backgroundMode: continuable
    maxActiveSubagents: 8

# 子代理逐次選模型（#875，卡 #709）：模型委派時可以從授權清單挑子代理跑哪一顆。**出廠關著**，同 dsh
# （`enabled` 預設 `false`、`allowedModels` 預設空，`packages/subagent/tool-subagent/src/model-selection-settings.ts:38-39`，`477b4f4`）。
# `allowedModels` 是 `live-model` 型錄裡的 id（我們只有一個端點，dsh 的 `{provider, model}` 路由在這裡就是型錄 id）。
# **新會話建立時取樣一次寫進日誌**，之後只讀日誌那份：打開設定只影響以後新開的會話。只有 `serve` 讀這一列。
- id: subagent-model-selection
  name: '#settings/subagent-model-selection'
  config:
    enabled: false
    allowedModels: []

# 真實供應商的連線值與模型型錄（#545／#457／#729），只在 `--live` 時才用。**連線那幾格都是 dsh 的設定欄位**：
# `@deepseek-ai/dsh-llm-deepseek` 的 `Config` 有 `baseURL`、`streamIdleTimeoutMs`、`retryPolicy`
# （`packages/llm/llm-deepseek/src/config.ts:83-100`，`ddefc45`），所以可設定本身沒有偏離，寫死才是。
# 值全是原本寫死的那幾個，測量與理由留在 `src/live-model.ts` 各常數的檔頭。
#
# 照抄不了的三處登記在 `src/settings/live-model.ts` 的檔頭：dsh 逐次請求解析端點，`ChatOpenAI` 表達
# 不出來，退到起動期解一次；重試只有次數（`AsyncCaller` 不收退避參數），而且因為退避沒有上限，次數
# 有上限；逾時是整個請求的逾時，不是 dsh 的串流閒置逾時。
#
# **`models` 是型錄**（#729），照 `llm-pi-ai` 一條路由的 `models` 清單（`packages/llm/llm-pi-ai/README.md:40-103`）：
# 每筆帶窗口、輸出上限（`maxTokens`，設了就是這顆每次請求送出去的 `max_tokens`）、`input`（收哪些種類，這是對端點
# 的宣告，不是檢查）、`reasoningEfforts`（`off:` 是不推理）與 `compat`（關推理的 chat template 參數）。
# **`modelId` 必須在裡面**，不在就是載入期失敗；**patch 寫 `models` 是整份取代**，不是逐筆合併。預設那顆模型是拿
# 「吃不吃得下 16384」當淘汰門檻選出來的——換一筆之前先確認它的 `maxTokens` 吃得下，吃不下的模型會每一次呼叫都失敗。
#
# **關推理的寫法（原本的 `thinkingOffBody`，#650）在預設那一筆的 `off` 等級與 `compat`**：標題呼叫（上面
# `thread-title-llm` 那一列）加進請求 body 的那幾格，用來關掉推理——預設那顆模型不關推理的話，64 個輸出 token 全被推理
# 吃光、一個標題都回不出來（實測 0/6，關掉 6/6）。`$var: thinking.enabled` 在 `off` 那一級解成 `false`；主請求不帶。
# 換一顆不認得這幾格的模型，不要寫 `compat`。登記在 `src/settings/live-model.ts` 的檔頭「偏離四」。
#
# **設定寫壞時**（#751）：帶 `--live` 就整個起不來，**不退回 schema 的預設值**——那份預設的網址是對外的公開端點，
# 退回去就連同金鑰一起送出去；沒帶 `--live` 時那份值沒人用，只印警告。
- id: live-model
  name: '#settings/live-model'
  config:
    baseUrl: 'https://integrate.api.nvidia.com/v1'
    modelId: 'nvidia/nemotron-3-super-120b-a12b'
    timeoutMs: 90000
    maxRetries: 6
    models:
      - id: 'nvidia/nemotron-3-super-120b-a12b'
        contextWindow: 700045
        maxTokens: 16384
        input: [text]
        reasoningEfforts:
          off:
          default: default
        tokenizer:
          digits: single
        compat:
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled

# 沒帶 `--live` 時用哪個模型提供者（#670）。照 dsh `agent-default-model`（`packages/bundle/base/cordis.patch.yml:82-86`）：
# 選擇是一列，提供者各是一列。**出貨值 `cli-script` 就是下面那一列腳本提供者的 `id`**；要換就在 patch 裡
# `insert` 一列別的提供者（例如另一份 `#settings/scripted-model`，腳本當 config）、再把這一列的 `provider` 指到它的 `id`，
# 形狀照 dsh 的 headless e2e（`apps/cli/tests/profiles/headless/tests/source-tool.built.e2e.ts:36-42`）。
#
# **帶了 `--live` 時這一列不看**：`--live` 是進 live 的唯一閘門，因為 `.env` 與代理在載入清單之前就依它處理好了。
# 這一列同 `live-model`，是起動期讀的、只講設定的列，`apply` 是空的；偏離與理由登記在 `src/model-provider.ts` 的檔頭。
- id: agent-default-model
  name: '#settings/default-model'
  config:
    provider: cli-script

# 出貨的假模型：沒帶 `--live` 時的預設提供者（#670）。**腳本就是這一列的 config**，所以 `--dump-config` 看得到它，
# 組裝用的和印出來的是同一份資料，不再有一份只存在程式碼裡的腳本。
#
# 它是對著這份清單寫的：拿 patch 把 `echo` 那一列關掉或換掉，就該一起換 `--live` 或換掉這一列的 `turns`——
# 腳本裡的工具名那時多半不存在，假模型只會製造一個看不懂的失敗。腳本四輪，而第一句話就用掉三輪
# （呼叫 echo、呼叫 write_file、拿到結果再回覆），第二句拿到最後一輪，所以假模型下的 REPL 問到第三句就會用完
# （`ScriptedChatModel` 當場失敗而不是靜默重播）；REPL 的正經用法是 `--live`。第二輪寫的檔（`/cli.md`）是給 `--workspace` 用的：預設的虛擬 FS 底下它只是讓
# 「虛擬檔案系統：…」那行有東西可印，換成真實磁碟時它就是「檔案真的落在那個目錄底下」的證據（`CLI_PROBE_FILE`）。
- id: cli-script
  name: '#settings/scripted-model'
  config:
    turns:
      - content: 先回聲一次，確認工具接得上。
        toolCalls:
          - name: echo
            args:
              message: CLI 接線測試
      - content: 再寫一個檔，確認檔案系統接得上。
        toolCalls:
          - name: write_file
            args:
              file_path: /cli.md
              content: CLI 寫的
      - content: 工具回來了，這條線是通的。
      - content: 假模型只會照腳本說話——要真的對話請用 --live。

# agent 迴圈的 super-step 上限（#457／#529）。**dsh 對這個值沒有意見**——它不跑 LangGraph，
# `recursionLimit` 在 `bundle/*` 的 patches 與 `core/agent-loop` 全樹零命中（`ddefc45`）。所以這一列
# 的形狀抄的是上面 core 那三列，不是抄 dsh 的某一列。
#
# **100 不是模型輪數**：換算是 `模型輪數 = floor((limit − 1) / 每輪格數)`，而每輪幾格取決於這一次
# 掛了哪些 middleware（預設組裝三格＝33 輪，再給 `--workspace` 是 32 輪；serve 另掛插話的載體（#710），
# 每輪四格，出貨清單上是 24 輪）。那正是這個值歸 harness
# 而不是歸 `@nexus/core` 的理由：core 不知道組裝長什麼樣。逐段實測見
# `src/settings/recursion-limit.ts` 的檔頭。
#
# **CLI 的 `--recursion-limit` 仍然贏過這一列**，走的是 #456 那三列既有的第一態（明著傳給組裝點
# 的參數 > 條目的服務 > 內建預設），不是一條新機制。
- id: recursion-limit
  name: '#settings/recursion-limit'
  config:
    limit: 100

# 每步平行工具呼叫上限（#711 第 1 步）：模型同一步吐出多顆工具呼叫時，同時在跑的最多幾顆。**id、欄位名與 10
# 都是 dsh 的**（`packages/core/agent-loop/src/index.ts:297`、`constants.ts:6`，`477b4f4`），dsh 沒有任何出廠組合覆寫它。
# **最小是 2，不是 dsh 的 1（串行）**：LangGraph 的 `maxConcurrency: 1` 跑完第一顆就靜靜收掉那一步，其餘工具呼叫
# 沒跑、也不報錯（基座的缺陷，理由與絆索在 `src/settings/agent-loop.ts` 檔頭）。
# 組裝期讀一次、帶進 LangGraph 的 `maxConcurrency`，一次性與背景子代理吃同一個值；改值要重啟（dsh 是熱重載，#46 不接）。
# **還沒有「平行安全／獨佔」的分類**（#711 第 2 步）：今天每顆都可以重疊，只是最多這麼多顆。
# **這一列關不掉**，理由同 `recursion-limit`：關掉會落回內建的 10，讀起來卻像解除了上限。
- id: agent-loop
  name: '#settings/agent-loop'
  config:
    maxParallelToolCalls: 10

# ── 檔案政策（#669）──────────────────────────────────────────────────────────
#
# **檔案政策那一句，永遠由這一列講。** 對應 dsh 的 `sandbox-policy`：不論有沒有 `--workspace` 都掛，
# 差別只在**講什麼、帶不帶控制器**——
#
# - **有 `--workspace`（檔案系統有圍堵）**：註冊 `/sandbox` 命令、升級流程、`sandbox/mode` 事件，並講目前的檔案政策。
#   組裝點會一起交出 `fsContainment` 與 `sandboxPolicy` 兩個服務；缺 `sandboxPolicy` 這一列載入當場拋。
# - **沒有 `--workspace`**：只貢獻一句不宣稱圍堵的政策，不註冊命令、不寫事件。以前這裡是整顆不掛，
#   那是「沒有圍堵就什麼都不講」，模型只能從工具行為猜自己能不能改檔。
#
# **有圍堵時這一列關不掉**：組裝點起動時檢查，有 `--workspace` 而這一列不在（或被停用）就起不來——fence 還在擋，
# 模型卻不知道、也請不到升級，看起來像關了護欄其實沒有。沒有圍堵時關掉它是合法的（只是少了那一句）。
# 沒有 `Config`：沒有可設的欄位，模式由 `--sandbox` 決定。
- id: sandbox-policy
  name: '@nexus/plugin-sandbox-policy'

# ── 配套入口 ──────────────────────────────────────────────────────────────────
#
# 只掛**有檢查的**配套入口，一共八個，不是只有 `@nexus/core`（#107 拍板）。#107 當時是二十個
# 全進；其中十二個是空 installer，掛上去一個檢查都不裝，買到的只有包名歸屬，所以 #974 拿掉了
# （dsh 早就判定「沒有獨立觀察就不要發布配套入口」，並於 `f028f25667d` 把整套運行時不變量
# 移除，見 `.docs/invariant-companions-decision-2026-10-03.md`）。**剩下這八個是暫時保留、
# 觀察中**，第二刀還沒決定。理由兩條：
#
# - **它們不裝功能，只裝觀察。** 一個配套入口不註冊工具、不改 prompt、不碰 backend，所以
#   「替誰決定該裝什麼」這個顧慮對它們不成立——沒有人的 agent 因為它們而不一樣。
# - **關得掉。** 條目層有 `disabled`（#104），組裝點有 `invariants` 選擇，所以進來不是
#   單向門。這是它們進得來的前提，而現在連 `disabled` 都寫得進使用者自己的 patch 檔。
#
# 八個各自在檢查的東西：`@nexus/core`（turn 配對）、`@nexus/plugin-commands`（命令生命週期
# 配對，#118）、`@nexus/plugin-plan-mode`（`/plan` 的參數契約，#120）、
# `@nexus/plugin-goal`（耐久 goal 串，#126）、`@nexus/plugin-todo`（耐久待辦快照的形狀
# 與歸屬，#132）、`@nexus/plugin-present`（每一筆交付對得上一次成功的 `present`，#441）、
# `@nexus/plugin-workspace-changes`（每一筆改動紀錄落在跑過工具的一輪裡，#443；那個功能
# 本身不在這份清單裡，在 serve 專屬的 `cordis.serve.yml`）、`@nexus/plugin-sandbox-policy`（每一顆 `sandbox/mode`
# 帶的都是認得的模式，#699）。
#
# **代價是每一次執行多八個條目、八次 `apply`**，換到的是這份清單與
# `registry.invariants.companions()` 對得起來。違規往哪裡印，見 `runCli` 接線的那一行。
#
# 這份清單要跟 `packages/*/src/invariant.ts` 對得上：少掛的那幾個會讓「這個 package 沒有
# 可檢的關係」與「這個 package 的檢查沒掛上」在診斷裡長得一模一樣。對帳由
# `invariant-companions.test.ts` 與 `package-invariants.test.ts` 守著（#489）。新增一個沒有
# 檢查的配套入口會被 `package-invariants` 擋下來——沒有可檢的關係就不要發布。
#
# **順序不是字母序，它是從舊的 `DEFAULT_PLUGINS` 照抄過來的**（#454 的搬家）。順序不承載
# 語意——啟用與否由服務相依決定，不由列的先後決定。要整理的話自己開一張卡，那不是這份
# 檔案裡的任何一條註解在擋你，只是沒有人做過。

- id: core-invariant
  name: '@nexus/core/invariant'
- id: commands-invariant
  name: '@nexus/plugin-commands/invariant'
- id: goal-invariant
  name: '@nexus/plugin-goal/invariant'
- id: plan-mode-invariant
  name: '@nexus/plugin-plan-mode/invariant'
- id: present-invariant
  name: '@nexus/plugin-present/invariant'
- id: workspace-changes-invariant
  name: '@nexus/plugin-workspace-changes/invariant'
- id: sandbox-policy-invariant
  name: '@nexus/plugin-sandbox-policy/invariant'
- id: todo-invariant
  name: '@nexus/plugin-todo/invariant'
