# 出貨的預設 plugin 清單。
#
# 這份檔案是「零設定的 nexus 由什麼組成」的唯一來源（#454）。使用者要改的話不是編輯它，
# 而是在 `$NEXUS_AGENT_HOME/cordis.patch.yml`（預設 `~/.nexus-agent/`）或 `--patch <檔>`
# 裡按 `id` 覆寫、停用、插入——patch 是整份替換 `config`，不是深層合併，所以覆寫的時候要
# 把想保留的欄位一起重述。
#
# 每一列的欄位：
#
#   id        這一次掛載的識別。外面的 patch 靠它指到這一列，所以名字是承重的。
#   name      模組 specifier，用動態 import 載進來再取 default export。
#   config    交給那顆 plugin 的設定，由它自己的 `Config` schema 驗。沒有 `Config` 的
#             plugin（下面二十個配套入口全部是）不得寫這個欄位。
#   disabled  這一次掛載不跑。只收字面布林——dsh 那邊可以寫 `!!js` 運算式，我們刻意不接
#             （#104 的偏離標註）。
#
# 疊完之後這台機器上實際長什麼樣，用 `--dump-config` 看（cli 與 serve 都收）：它印出啟動
# 真的會掛的那一份，每一段前面標明那幾列來自哪個檔、被哪幾層改過；指到不存在 id 的 patch
# 會連同它那一層的標籤報到 stderr。用法見 docs/operations.md 的「plugin 清單」一節。
#
# 順序不承載語意，分組是給人看的。

# ── 功能 ──────────────────────────────────────────────────────────────────────
#
# **工具只有 echo 一個。** 預設組裝要能證明「工具真的接上了」，而不是替誰決定該裝什麼。
# 哪些工具 plugin 該進出貨清單是設定的事——這份檔案就是那件事有地方講之後的樣子（#46）。
#
# 下面四個是講得出理由的例外，每一個的代價都寫在它自己那一列上。

- id: echo
  name: '@nexus/plugin-echo'

# 工作區指令（#388）：產品路徑上的 CLI 與 serve 也看得到 `AGENTS.md`。有 backend
# 才會真的建 middleware，所以沒給 `--workspace` 時它什麼都不加——與 dsh「沒有檔案系統
# 提供方就載不到」同形。
- id: agent-instructions
  name: '@nexus/plugin-agent-instructions'

# **例外一：計劃模式**（#120）。它註冊的是一個**人打得到的命令**，而命令沒進出貨清單就
# 等於不存在——`/plan` 會被 `parseCommand` 判成「名字不認得」，照原樣掉回模型，變成一行
# 沒人懂的純文字。「不替誰決定該裝什麼」在這裡撞上「那就誰也用不到」，後者比較貴。
#
# 代價三筆：
#
# - `startActive` 是關的，所以不打 `/plan` 的話指引一個 token 都不夾。
# - `exit_plan_mode` 一律出現在面向模型的工具清單裡（照 dsh：模式轉換不該額外造成工具
#   目錄變動）。CLI 上它是活的 schema、死的執行路徑——模式外撞 middleware、模式內撞
#   `HEADLESS_APPROVALS` 的確定性拒絕。
# - **serve 也吃這份清單**，而那條路上有命令介面（#123）：web 那端自己打 `/plan` 就進得
#   去，而且核准是開著的，所以「規劃 → 交計劃 → 有人按批准 → 開始動手」整條走得完——那
#   是 CLI 這條路走不完的。
- id: plan-mode
  name: '@nexus/plugin-plan-mode'

# **例外二：goal**（#126）。同一條理由：命令沒進清單，`/goal 把測試修綠` 會掉回模型變成
# 一句閒聊。代價兩筆：每一次執行多接一位會話參與者，以及模型側多三顆工具
# （`create_goal`／`get_goal`／`update_goal`，#177 之後才有的東西，一律 `rootOnly`，所以
# subagent 那幾份看到的是拒絕樁）。它不改 prompt、不碰 backend，沒有目標時連一顆事件都
# 不寫；但工具清單與那幾顆的 token 確實變了。
#
# **域與命令是同一個 plugin**，不像 dsh 拆成兩個套件——理由寫在 `@nexus/plugin-goal` 的
# 檔頭上。
- id: goal
  name: '@nexus/plugin-goal'

# **例外三：todo**（#132），代價是四者裡最重的：它**真的多一顆面向模型的工具**
# （`todo_write`），所以每一次請求都多一份 schema 與描述的 token，不打任何命令也一樣。
#
# 它進得來的理由不是「順便」，是**它沒有別的入口**：todo 是模型自己的規劃工具，人不打
# 它、命令也叫不動它，所以「沒進清單就等於不存在」對它比對前兩個更絕對。dsh 對「先想再
# 做」的答案是計劃模式 ＋ todo ＋ goal 三件一組，這是第三件。
#
# `allowParallelInProgress`：這棵樹的 subagent 是真的併發跑的（`tool-session-log.test.ts`
# 那條同一個 subagent 併發兩次的驗收），而 dsh 對這種部署開的就是 true。這個開關沒有預設
# 值，理由見 `TodoPluginOptions`。
- id: todo
  name: '@nexus/plugin-todo'
  config:
    allowParallelInProgress: true

# 評分與 `/feedback`：預設就裝，零設定的 serve 與 CLI 都評得到（#278）。
#
# `maxNoteBytes` 是一則評分備註最多幾個 UTF-8 位元組。照 dsh web 那一包的設定
# （`packages/bundle/web-app/cordis.patch.yml:56`，`c291e79`）；plugin 自己不給預設值，
# 所以這一行是整棵樹上唯一講這個數字的地方。
- id: feedback
  name: '@nexus/plugin-feedback'
  config:
    maxNoteBytes: 8192

# **例外四：交付宣告**（#441）。dsh 的 standard preset 掛 `tool-present`，而 web 的交付
# 卡片讀的事件只有它寫得出來。代價同 todo，多一顆面向模型的工具（`present`）；沒有工作區
# 時工具照樣在、叫了被拒，同 dsh。
- id: present
  name: '@nexus/plugin-present'

# ── core 的設定 ──────────────────────────────────────────────────────────────
#
# 這幾列**不裝功能，只講設定**。**它們內部分兩層，分界同 harness 那一段——消費點跑的時刻**：
# 前六列（到 `approval-gate` 為止）是**組裝期**（#456），消費者是 `foldRegistry`，註冊表就在
# 手上；最後一列 `session-persistence` 是**起動期**（#529），理由寫在它自己那一段上。
#
# 組裝期那六列：middleware 本身由 `foldRegistry` 建與排位——位置
# 是承重的（有四條測試釘著）、而且有一顆必須逐個 agent 各建一份，這兩件事
# `registry.middleware.use()` 都表達不出來。所以帶設定的條目，`apply` 只做一件事：把驗過的
# 設定提供成一個服務，fold 從那裡讀；**沒有設定的那一顆連服務都不註冊**（照 dsh 的
# `fs-observation-policy`），它在場的唯一意義是「關得掉」。偏離登記在 `@nexus/core` 對應那
# 個檔的檔頭上。
#
# **關掉它就是 `disabled: true`**，語意照 dsh：條目不掛，那一顆 middleware 真的不在 stack
# 裡。要改設定就在 patch 檔裡重寫這一列的 `config`——整份替換，沒重述的欄位回到預設值。
#
# **組裝期那六列的最後一列是例外，而且是明著的例外**：核准閘門關不掉，`disabled: true` 在
# 載入期當場拋。理由寫在它自己那一段上。

# 連續重複同參數呼叫同一個工具時提醒模型（#147）。門檻與參數預覽字數照 dsh base 的
# `repeat-tool-reminder`（`packages/bundle/base/cordis.patch.yml:441`，`ddefc45`）；
# `include`／`exclude` 是我們多的兩格，空陣列＝追蹤全部工具。
#
# **這一列寫出全部四格是刻意的**：patch 是整份替換 `config`，所以照著改的人手上要有完整
# 的一份可以抄；而預設值本身寫在 plugin 的 schema 裡，不是寫在這裡。
- id: repeat-reminder
  name: '@nexus/core/repeat-reminder'
  config:
    thresholds: [3, 5, 8]
    include: []
    exclude: []
    argumentsPreviewChars: 500

# 摘要之前先把過長的工具結果剪掉中段（#446）。三格預算照 dsh base 的 `tool-result-pruner`
# （`packages/bundle/base/cordis.patch.yml:404`，`ddefc45`）。
#
# **只在摘要開著時有作用**：dsh 的 pruner 唯一的消費者是 compaction，摘要不掛就沒人叫它。
# 但設定照樣在載入期驗——寫錯不會因為今天剛好沒用到就放過。
- id: tool-result-pruner
  name: '@nexus/core/tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# 壓力達標時把舊訊息摘要成一則，歷史 offload 到 backend（#143）。四格**全部寫出來**，理由
# 同上面兩列：patch 是整份替換 `config`。這幾個數字的來歷（尤其 `tokens: 100000` 為什麼是
# 這個值、以及換模型要重量一次）寫在 `DEFAULT_SUMMARIZATION` 的檔頭上，不在這裡重述。
#
# **關掉它（`disabled: true`）發的是一顆同名空殼，不是「沒有」**：基座無條件建一顆摘要器，
# 同名取代是唯一消得掉它的辦法。連帶沒有的還有歷史 offload 與上面那把剪刀。
- id: summarization
  name: '@nexus/core/summarization'
  config:
    trigger:
      - { type: tokens, value: 100000 }
      - { type: messages, value: 60 }
    keep: { type: messages, value: 20 }
    truncateArgs:
      trigger: { type: messages, value: 20 }
      keep: { type: messages, value: 20 }
    historyPathPrefix: /conversation_history

# 先讀後改：沒讀過的檔不准改（#273）。照 dsh base 的 `fs-observation-policy`
# （`packages/bundle/base/cordis.patch.yml:264`，`ddefc45`）預設就載著。
#
# **這一列刻意沒有 `config:`**，而且不可以加：這一顆沒有設定，plugin 也就沒有 Config
# schema，而載入器對「沒有 schema 卻給了 config」是**當場拋**，不是默默吞掉。它跟上面兩列
# 因此差一格——上面兩列是四態（明著傳的 > 條目的設定 > 被關掉 > 內建預設），這一列只有
# 三態，因為「條目在場」與「沒有經過設定檔」的答案都是「開著」。
#
# 關掉它等於**這個組裝接受盲改**，不是省一點開銷。
- id: observation-policy
  name: '@nexus/core/observation-policy'

# 每一次模型呼叫的 token 帳目記進會話日誌（#264）。**這一列刻意沒有 `config:`**，理由同上
# 一列：這一顆沒有任何數字可以調，plugin 也就沒有 Config schema，而載入器對「沒有 schema
# 卻給了 config」是當場拋。所以它跟上面那一列一樣是三態。
#
# **關掉它之後不見的是落盤日誌裡那本逐次呼叫的 token 帳**（`model/usage`），連帶 web 用量表
# 的「目前大小」那一行（#528，它讀 root 最新那一筆；環與比例讀的是摘要器的量測，照舊在）。
# 加總它的仍然沒有——評估那條路的數字是它自己從 `usage_metadata` 加的，跟這一顆無關。
- id: model-usage
  name: '@nexus/core/model-usage'

# 核准閘門（#111）。**這一列關不掉**：寫 `disabled: true` 會在載入期當場拋，`--dump-config`
# 也一樣擋——檢查住在 `validateEntries` 裡，兩條路共用它。
#
# 它跟上面五列都不同型：上面五列的 `disabled` 是真的會讓那一顆不在 stack 裡，這一列的
# `disabled` 是一個錯誤。閘門由 `foldRegistry` 無條件建，今天沒有任何設定關得掉它，
# 而這一列不存在的時候 `- id: approval-gate` ＋ `disabled: true` 只會警告一行然後跳過
# ——讀起來像成功關掉了，實際上核准照樣在問。量過（2026-09-22）：exit 0、stderr 一行、
# dump 與沒帶那份 patch 逐字相同。
#
# 第二個理由跟擋人無關：**這一列讓核准在 `--dump-config` 裡看得見**。沒有它的時候，那份
# dump 從頭到尾沒有任何一列跟核准有關，想確認「這台機器上核准是開的嗎」的人分不出來。
#
# `config:` 同上，不可以加。
- id: approval-gate
  name: '@nexus/core/approval-gate'

# 會話日誌落盤的批次窗口，毫秒（#457／#529）。**這一列跟上面六列不同層**：上面六列的消費者
# 是 `foldRegistry`（組裝期，註冊表在手上），這一列的消費者是 `cli.ts` 與 `serve.ts` 裡呼叫
# `attachSessionPersistence` 的那兩行——跑在 `createCliAgent` 回來之後，而那個函式一格註冊表
# 都沒有回傳。更硬的理由是壽命：窗口講的是那一顆 `SessionStore` 的寫入節奏，而 store 在 serve
# 上是**整台伺服器一份**、註冊表是**一條 thread 一份**。所以這一列的 `apply` 是空的，值由
# `startupSetting` 在起動期解一次往下傳，同上面 harness 那三列的機制。
#
# **dsh 對這個值沒有意見**：它的 `session-persistence-jsonl` 只收 `root` 與 `compression`
# （`packages/session/session-persistence-jsonl/src/index.ts:236-239`，`ddefc45`），因為 dsh 的
# 批次是呼叫端傳一整批，不是計時器攢批。所以這一列的形狀抄的是上面那六列，不是抄 dsh 的某一
# 列——這不是「表達不出來」的偏離，是標準沒有這個旋鈕。
#
# **這一列關不掉**（理由同起動期那三列）：`startupSetting` 把關掉的那一列當成沒有那一列，於是
# 回到 schema 的預設值——落盤照樣批次、照樣 10 毫秒，只有讀設定的人以為自己關掉了什麼。
#
# **0 是合法值**，意思是不批次、每一顆事件各寫一次；上限是 `setTimeout` 收得住的
# 2 147 483 647，超過它的值會讓計時器**立刻**觸發（等於窗口消失），所以擋在 schema 上。
- id: session-persistence
  name: '@nexus/core/session-persistence'
  config:
    windowMs: 10

# ── harness 自己的設定 ────────────────────────────────────────────────────────
#
# 這幾列跟上面那段 core 的 middleware 設定同一個用途——**不裝功能，只講設定**——但擁有者住在
# `apps/harness`（[#529](https://github.com/DemianLi/nexus-agent/issues/529)）。
#
# **它們內部又分兩層，分界是消費點跑的時刻**：
#
# - **起動期**（`thread-title`、`browser-session`、`deliverable-files`、`tool-text`、`live-model`）：消費者是
#   `serve.ts` 的冷讀清單、`BrowserAuth` 的建構子、`createWireHandler` 閉包裡的兩條交付路由，以及交給
#   組裝的那顆 model——全都在**任何 agent 出生之前**就要有值，那一刻註冊表還不存在。所以這幾列的 `apply` 是空的，值由
#   `src/settings/startup.ts` 的 `startupSetting` 在起動期解一次、往下傳一份——形狀上仍是
#   「值從一個地方來」，機制上不是服務，那條退讓登記在 #529 上。
# - **組裝期**（`recursion-limit`）：消費者是 `agent-factory.ts`，跑在 `loadPlugins` 之後，
#   **註冊表就在手上**。所以這一列跟上面 core 那三列完全同形——`apply` 把驗過的值提供成一個
#   服務，消費點去讀服務。這一層做得到的事，不該跟著上一層退。
#
# **`name` 是 `#settings/…` 而不是一個套件名**，那是一條登記過的偏離，六列共用：dsh 的每個可調值
# 都由一個套件擁有，而 `apps/harness` **解不到自己**（條目走 `import(entry.name)`，`@nexus/harness`
# 沒有連進自己的 `node_modules`，實測是 `Cannot find package`）。退到 Node 的 `imports` 欄位，映射
# 寫在 `apps/harness/package.json` 裡看得見。逐條理由在 `src/settings/thread-title.ts` 的檔頭。
#
# **這六列關不掉**（`plugin-config.ts` 的 `PROTECTED_ENTRY_NAMES`），但理由分兩種。起動期那五列是
# 「關掉沒有意義」：它們不裝任何東西，關掉不會讓標題不再被裁切、cookie 不再過期、交付檔不再有
# 上限——`startupSetting` 把關掉的那一列當成沒有那一列，於是回到 schema 的預設值。
# `recursion-limit` 硬一級——關掉它在機制上確實會讓服務消失、於是落回內建的 100，**看起來像關掉了
# 護欄，實際上護欄還在**。兩種都只會讓人以為自己關掉了什麼。

# 執行緒列表上標題的兩個上限（#302）。值照 dsh base 的 `session-title`
# （`packages/bundle/base/cordis.patch.yml:55-60`，`ddefc45`：`fallbackMaxWords: 5`、
# `fallbackMaxBytes: 40`），**數字一模一樣**。
#
# 兩格全部寫出來，理由同上面那三列：patch 是整份替換 `config`，照著改的人手上要有完整的一份
# 可以抄；預設值本身寫在 schema 裡，不是寫在這裡。40 個位元組是 13 個中文字——中文沒有空白，
# 詞數那一格咬不到。
- id: thread-title
  name: '#settings/thread-title'
  config:
    maxWords: 5
    maxBytes: 40

# 瀏覽器 cookie 的絕對有效期（#424）。dsh 那側是 plugin 設定 `cookieMaxAgeDays`，預設同樣是 30
# ——這一列補上的正是 `browser-auth.ts` 原本登記的那條偏離（「寫死 30 天，不能設定」）。
- id: browser-session
  name: '#settings/browser-session'
  config:
    maxAgeDays: 30

# 交付檔的三個上限（#452／#457）。**形狀與數值都沒有偏離**：dsh 的
# `@deepseek-ai/dsh-api-workspace-files` 就是一顆 plugin 三格（`packages/api/workspace-files/
# src/index.ts:185-189`，`ddefc45`），三個預設值逐字相同——2 MiB、32 MiB、5000。欄位名照它。
#
# **`maxLines` 是雙用的**：沒給 `limit` 查詢參數時用它當預設，給了就不准超過它。dsh 一樣
# （`index.ts:371-373` 兩處讀同一個 `this.config.maxLines`）。所以改這一格會同時動到兩個行為。
#
# 三格全部寫出來，理由同上面那幾列：patch 是整份替換 `config`。
- id: deliverable-files
  name: '#settings/deliverable-files'
  config:
    maxBytes: 2097152
    maxFileBytes: 33554432
    maxLines: 5000

# 一段工具結果文字放上線的位元組上限（#538／#457）。**「可設定」這件事本身沒有偏離，寫死才有**：
# dsh 那側它本來就是條目的一格（`spill-policy` 的 `maxInlineBytes: 50000`，
# `packages/bundle/base/cordis.patch.yml:393-396`，`ddefc45`，**數字一模一樣**），所以這一刀是把一條
# 既存的偏離收掉。**截在哪一層**那條偏離仍然登記在 `src/tool-result-text.ts` 的檔頭上——dsh 截在
# 模型面、超標存成 spill 檔、通知裡帶得出檔案位址；我們沒有 spill 能力，只能截在放上線那一刻。
#
# 欄位名沒照 dsh 的 `maxInlineBytes`：那個名字描述的是 dsh 的二分（inline 還是進 spill 檔），而我們
# 超過就是截斷，沒有「另一半去哪裡」這回事。
#
# **改這一格會讓一條跨套件的比例失效，而且沒有任何東西會紅。** `@nexus/wire` 的
# `HISTORY_PAGE_MAX_BYTES = 4_000_000` 是 `80 × 50000`，那個關係一直由 `apps/harness` 的一條測試釘著；
# 這一列讓它**只在 schema 的預設值底下成立**。那是 #538 三選一裡明著選的第三條（2026-09-23 拍板），
# 逐條理由見 `src/settings/tool-text.ts` 的檔頭。
- id: tool-text
  name: '#settings/tool-text'
  config:
    maxBytes: 50000

# 真實供應商的五個連線值（#545／#457），只在 `--live` 時才用。**五格都是 dsh 的設定欄位**：
# `@deepseek-ai/dsh-llm-deepseek` 的 `Config` 有 `baseURL`、`maxTokens`、`streamIdleTimeoutMs`、
# `retryPolicy`（`packages/llm/llm-deepseek/src/config.ts:83-100`，`ddefc45`），所以可設定本身沒有偏離，
# 寫死才是。值全是原本寫死的那幾個，測量與理由留在 `src/live-model.ts` 各常數的檔頭。
#
# 照抄不了的三處登記在 `src/settings/live-model.ts` 的檔頭：dsh 逐次請求解析端點，`ChatOpenAI` 表達
# 不出來，退到起動期解一次；重試只有次數（`AsyncCaller` 不收退避參數），而且因為退避沒有上限，次數
# 有上限；逾時是整個請求的逾時，不是 dsh 的串流閒置逾時。
#
# **`modelId` 與 `maxOutputTokens` 是綁著的**：預設那顆模型是拿「吃不吃得下 16384」當淘汰門檻選出來的。
# 換其中一個之前拿另一個重新確認——吃不下的模型會每一次呼叫都失敗。
- id: live-model
  name: '#settings/live-model'
  config:
    baseUrl: 'https://integrate.api.nvidia.com/v1'
    modelId: 'nvidia/nemotron-3-super-120b-a12b'
    maxOutputTokens: 16384
    timeoutMs: 90000
    maxRetries: 6

# agent 迴圈的 super-step 上限（#457／#529）。**dsh 對這個值沒有意見**——它不跑 LangGraph，
# `recursionLimit` 在 `bundle/*` 的 patches 與 `core/agent-loop` 全樹零命中（`ddefc45`）。所以這一列
# 的形狀抄的是上面 core 那三列，不是抄 dsh 的某一列。
#
# **100 不是模型輪數**：換算是 `模型輪數 = floor((limit − 1) / 每輪格數)`，而每輪幾格取決於這一次
# 掛了哪些 middleware（預設組裝三格＝33 輪，再給 `--workspace` 是 32 輪）。那正是這個值歸 harness
# 而不是歸 `@nexus/core` 的理由：core 不知道組裝長什麼樣。逐段實測見
# `src/settings/recursion-limit.ts` 的檔頭。
#
# **CLI 的 `--recursion-limit` 仍然贏過這一列**，走的是 #456 那三列既有的第一態（明著傳給組裝點
# 的參數 > 條目的服務 > 內建預設），不是一條新機制。
- id: recursion-limit
  name: '#settings/recursion-limit'
  config:
    limit: 100

# ── 配套入口 ──────────────────────────────────────────────────────────────────
#
# 二十個全進，不是只有 `@nexus/core`（#107 拍板）。理由三條：
#
# - **它們不裝功能，只裝觀察。** 一個配套入口不註冊工具、不改 prompt、不碰 backend，所以
#   「替誰決定該裝什麼」這個顧慮對它們不成立——沒有人的 agent 因為它們而不一樣。
# - **關得掉。** 條目層有 `disabled`（#104），組裝點有 `invariants` 選擇，所以進來不是
#   單向門。這是它們進得來的前提，而現在連 `disabled` 都寫得進使用者自己的 patch 檔。
# - **二十個全進。** 十三個是空 installer，掛上去一個檢查都不裝，買到的只有包名歸屬；真的
#   在檢查的是七個——`@nexus/core`（turn 配對）、`@nexus/plugin-commands`（命令生命週期
#   配對，#118）、`@nexus/plugin-plan-mode`（`/plan` 的參數契約，#120）、
#   `@nexus/plugin-goal`（耐久 goal 串，#126）、`@nexus/plugin-todo`（耐久待辦快照的形狀
#   與歸屬，#132）、`@nexus/plugin-present`（每一筆交付對得上一次成功的 `present`，#441）、
#   `@nexus/plugin-workspace-changes`（每一筆改動紀錄落在跑過工具的一輪裡，#443；那個功能
#   本身不在這份清單裡，只由 serve 掛）。
#
# **代價是每一次執行多二十個條目、二十次 `apply`**，換到的是這份清單與
# `registry.invariants.companions()` 對得起來。違規往哪裡印，見 `runCli` 接線的那一行。
#
# 這份清單要跟 `packages/*/src/invariant.ts` 對得上：少掛的那幾個會讓「這個 package 沒有
# 可檢的關係」與「這個 package 的檢查沒掛上」在診斷裡長得一模一樣。對帳由
# `invariant-companions.test.ts` 與 `package-invariants.test.ts` 守著（#489）。
#
# **順序不是字母序，它是從舊的 `DEFAULT_PLUGINS` 照抄過來的**（#454 的搬家）。順序不承載
# 語意——啟用與否由服務相依決定，不由列的先後決定。要整理的話自己開一張卡，那不是這份
# 檔案裡的任何一條註解在擋你，只是沒有人做過。

- id: core-invariant
  name: '@nexus/core/invariant'
- id: agent-instructions-invariant
  name: '@nexus/plugin-agent-instructions/invariant'
