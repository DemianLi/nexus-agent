# 把 harness 自己那幾列的設定改掉（#529 的驗收：「在設定裡覆寫會生效」）。
#
# **`deliverable-files` 那一列不在這裡**，那是刻意的：它的覆寫要看得見就得有一個宣告過的交付檔，
# 而 serve 不帶 `--live` 時的假模型腳本（`cli.ts` 的 `CLI_SCRIPT`）一次都不呼叫 `present`。
# 它的驗收因此在 `deliverable-files.test.ts`——四條走 `createWireHandler` 的行為測試，
# 外加一條釘住 `serve.ts` 那一行的結構性檢查。
#
# **`config` 是整份替換，不是逐格合併**，所以 `thread-title` 這一列沒有重述 `maxWords`：
# 它回到 schema 的預設值。那正是這裡要的——順帶證明沒重述的那一格不會變成 `undefined`。
#
# **`session-persistence` 的 3000 非得遠大於 10 不可，而且要遠大於測試的等待時間。** 它的
# schema 預設、出貨那一列的值、以及協調器自己的退路是同一個 10，三個來源重合，所以拿 10 去
# 驗量不出東西。3000 讓兩臂分得開：預設那臂在 50 毫秒內就落盤（實測），這一臂等 300 毫秒還
# 是空的——要假綠得等滿三秒。讀它的是 `startup.test.ts` 那條兩臂測試。
#
# **`tool-text` 的 300 非得遠小於 50000 不可。** 同樣的三源重合（出貨那一列、schema 預設、以及
# `ThreadPump` 與 `historyPage` 各自的 `?? parse({})` 退路），拿 50000 去驗量不出東西。300 小到
# 一段普通的工具結果就會被截，所以「那一列有沒有講話」在畫面上就看得出來。
#
# **`recursion-limit` 的 40 非得不是 100 不可。** 它的 schema 預設與組裝點的內建預設是同一個
# 數字，所以拿 100 去驗「出貨那一列真的在講話」量不出東西——兩個來源重合的時候，量到的值對
# 兩邊都成立。40 讓它們分得開。讀它的是 `agent-factory.test.ts` 那條整路測試。
- id: thread-title
  config:
    maxBytes: 6
- id: browser-session
  config:
    maxAgeDays: 1
- id: recursion-limit
  config:
    limit: 40
- id: session-persistence
  config:
    windowMs: 3000
- id: tool-text
  config:
    maxBytes: 300
