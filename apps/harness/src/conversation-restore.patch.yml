# 把 conversation-restore.fixture.ts 那顆請求記錄器插到出貨清單上。
#
# `name` 是相對這個檔的路徑，載入前會轉成 file URL（#499）。模組要 `export default` 那顆
# plugin——一個 patch 條目對一顆，不是對一份清單。
- insert:
    - id: request-recorder
      name: './conversation-restore.fixture.ts'
# 不相干的列關掉：`time-context`（#1625）每次呼叫多一則帶牆鐘時間的訊息，這一檔數的是「續接之後模型收到哪幾則」。
- id: time-context
  disabled: true
