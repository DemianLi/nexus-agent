[package]
name = "nexus-host"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
nexus-sandbox-spawner = { path = ".." }
libc = "=0.2.191"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
saphyr-parser = { version = "=0.3.3", default-features = false }

[features]
# 只給整合測試：把 `test-echo` 插件編進 `--plugins` 認得的清單，並打開 spawner 那邊的 test-hooks。出貨的建置不帶它。
test-hooks = ["nexus-sandbox-spawner/test-hooks"]
