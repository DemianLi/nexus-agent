[package]
name = "nexus-sandbox-spawner"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
landlock = "=0.4.7"
libc = "=0.2.191"

[profile.release]
strip = true
panic = "abort"

[features]
# 只給整合測試：讀 NEXUS_SPAWNER_TEST_ABI_CAP 把 Landlock 的 ABI 壓低，造出 partial；讀 NEXUS_SPAWNER_TEST_CHILD_DELAY_US 讓子行程在 setsid 之前先睡。出貨的建置不帶它（CI 形狀測試釘住）。
test-hooks = []
